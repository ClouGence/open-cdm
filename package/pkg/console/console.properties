##############################################################
##                                                   Server ##
##############################################################
server.port=8222
clouddm.rsocket.dns=127.0.0.1
clouddm.rsocket.console.port=8008
##############################################################
##                                               DataSource ##
##############################################################
spring.datasource.jdbcurl=jdbc:mysql://127.0.0.1:3306/cdmgr
spring.datasource.username=
spring.datasource.password=
##############################################################
##                                                DM Config ##
##############################################################
# Web sessions: stable cookie, threshold renewal; all Console nodes must agree.
# clougence.rdp.login.expire.sec has been removed.
clougence.rdp.session.activity-window-sec=86400
clougence.rdp.session.renewal-threshold-sec=21600
# Zero disables the absolute lifetime limit.
clougence.rdp.session.absolute-lifetime-sec=0
# Before changing absolute-lifetime-sec, revoke existing sessions during maintenance.
# Cookie Domain is host-only by default. Set login.cookie.domain only for shared subdomains.
clouddm.console.max-tx-session-user=20
console.config.cross.origins=*
