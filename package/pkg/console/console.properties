##                                           Connect Gateway ##
##############################################################
# 网关登录：console 部署在 connect 网关之后，网关认证完成后透传 X-Connect-Token，
# console 自动识别该身份并匹配/创建内部账户，secret-key 留空表示关闭该能力。
# secret-key 必须与网关的 secret_key(或 SECRET_KEY / SESSION_KEY) 保持一致。
# 也可以完全改用环境变量（容器部署推荐，非空的环境变量优先于本文件）：
#   CONNECT_SECRET_KEY / CONNECT_DEFAULT_ROLE / CONNECT_ADMIN_ROLE
#   CONNECT_ADMIN_PERMISSIONS / CONNECT_ALLOW_PERMISSIONS
#clouddm.connect.secret-key=
#clouddm.connect.default-role=Developers
#clouddm.connect.admin-role=Manager
#clouddm.connect.admin-permissions=ADMIN
#clouddm.connect.allow-permissions=
