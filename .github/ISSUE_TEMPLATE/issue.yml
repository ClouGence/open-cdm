name: Issue report
description: Report a bug, request a feature, or suggest a documentation improvement.
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve CloudDM.

        Briefly describe the issue or suggestion. Do not include passwords, tokens, or other sensitive information.

  - type: textarea
    id: description
    attributes:
      label: Issue or suggestion
      description: Tell us what happened or what you would like CloudDM to support.
      placeholder: Enter the details here.
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: Additional context (optional)
      description: Add screenshots, logs, environment details, or related issues if helpful.
