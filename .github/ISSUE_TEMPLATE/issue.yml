name: Issue 反馈
description: 报告缺陷、提出功能建议或文档改进意见。
body:
  - type: markdown
    attributes:
      value: |
        感谢你帮助改进 CloudDM。

        请简单描述遇到的问题或你的建议，不要包含密码、令牌等敏感信息。

  - type: textarea
    id: description
    attributes:
      label: 问题或建议
      description: 请告诉我们发生了什么，或者你希望 CloudDM 支持什么。
      placeholder: 在这里填写内容。
    validations:
      required: true

  - type: textarea
    id: additional-context
    attributes:
      label: 补充信息（可选）
      description: 可以添加截图、日志、环境信息或关联 issue。
