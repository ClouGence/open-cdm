name: Docker Hub

run-name: Publish images ${{ github.ref_name }}

# Publish the CloudDM images of this fork to Docker Hub.
#
# Trigger it by pushing a version tag (v4.2.2 or v4.2.2-rc.1), or run it manually with a version.
# The version is injected as CG_CLOUDDM_MAIN_VERSION, so the packages, the version file inside the
# image and the image tag always agree.
#
# Required repository secrets:
#   DOCKERHUB_USERNAME  Docker Hub account, also the default image namespace
#   DOCKERHUB_TOKEN     Docker Hub access token with read and write
# Optional repository secrets:
#   DOCKER_VERSION_FEISHU_BOT_WEBHOOK_URL  send a Feishu notification when the publish finished
# Optional repository variables:
#   DOCKERHUB_NAMESPACE     image namespace, defaults to DOCKERHUB_USERNAME
#   DOCKERHUB_IMAGE_PREFIX  image name prefix, defaults to cgdm

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: "version, e.g. 4.2.2 or 4.2.2-rc.1"
        required: true
        type: string
      services:
        description: "services to publish, comma separated (alone, console, sidecar)"
        required: true
        default: 'alone,console,sidecar'
        type: string
      platforms:
        description: "platforms, e.g. linux/amd64 or linux/amd64,linux/arm64 (arm64 is slow with QEMU)"
        required: true
        default: 'linux/amd64'
        type: string
      latest:
        description: "also publish the latest tag (a prerelease version cannot be latest)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: docker-hub-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ${{ vars.DOCKERHUB_IMAGE_PREFIX || 'cgdm' }}

jobs:
  meta:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      latest: ${{ steps.resolve.outputs.latest }}
      services: ${{ steps.resolve.outputs.services }}
      platforms: ${{ steps.resolve.outputs.platforms }}
    steps:
      - name: Resolve version, latest flag, services and platforms
        id: resolve
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF_NAME: ${{ github.ref_name }}
          INPUT_VERSION: ${{ inputs.version }}
          INPUT_SERVICES: ${{ inputs.services }}
          INPUT_PLATFORMS: ${{ inputs.platforms }}
          INPUT_LATEST: ${{ inputs.latest }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "push" ]]; then
            version="${REF_NAME#v}"
            services="alone,console,sidecar"
            platforms="linux/amd64"
            latest="true"
          else
            version="$INPUT_VERSION"
            services="$INPUT_SERVICES"
            platforms="$INPUT_PLATFORMS"
            latest="$INPUT_LATEST"
          fi

          # 4.2.2 or a semver prerelease such as 4.2.2-rc.1 / 4.2.2-connect.1
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "::error::version must look like 4.2.2 or 4.2.2-rc.1, got ${version}"
            exit 1
          fi

          prerelease="false"
          if [[ "$version" == *-* ]]; then
            prerelease="true"
          fi

          if [[ "$EVENT_NAME" == "push" ]]; then
            # a release tag publishes latest as well, a prerelease tag only publishes its own version
            if [[ "$prerelease" == "true" ]]; then
              latest="false"
            else
              latest="true"
            fi
          elif [[ "$prerelease" == "true" && "$latest" == "true" ]]; then
            echo "::error::a prerelease version cannot be published as latest"
            exit 1
          fi

          platforms="${platforms:-linux/amd64}"

          matrix="["
          separator=""
          IFS=',' read -ra parts <<< "$services"
          for part in "${parts[@]}"; do
            part="$(echo "$part" | tr -d '[:space:]')"
            if [[ -z "$part" ]]; then
              continue
            fi
            case "$part" in
              alone|console|sidecar) ;;
              *) echo "::error::unknown service: ${part}"; exit 1 ;;
            esac
            matrix+="${separator}\"${part}\""
            separator=","
          done
          matrix+="]"
          if [[ "$matrix" == "[]" ]]; then
            echo "::error::at least one service is required"
            exit 1
          fi

          echo "version=${version}" >> "$GITHUB_OUTPUT"
          echo "latest=${latest}" >> "$GITHUB_OUTPUT"
          echo "services=${matrix}" >> "$GITHUB_OUTPUT"
          echo "platforms=${platforms}" >> "$GITHUB_OUTPUT"
          echo "resolved: version=${version} latest=${latest} services=${matrix} platforms=${platforms}"

  build-tgz:
    name: Build tgz
    runs-on: ubuntu-latest
    needs: meta
    env:
      CG_CLOUDDM_MAIN_VERSION: ${{ needs.meta.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Set up Node.js 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache built-in drivers bundle
        uses: actions/cache@v6
        with:
          path: package/pkg/builtin-drivers/bundle
          key: builtin-drivers-${{ hashFiles('package/pkg/builtin-drivers/built-in-drivers.xml') }}

      - name: Build tgz packages
        working-directory: package
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g
        run: ./package.sh --build

      - name: Verify the version inside the packages
        env:
          VERSION: ${{ needs.meta.outputs.version }}
        run: |
          set -euo pipefail
          for svc in alone console sidecar; do
            tgz="package/build/cgdm-${svc}.tar.gz"
            if [[ ! -f "$tgz" ]]; then
              echo "::error::missing package: ${tgz}"
              exit 1
            fi
            inner="$(tar -xzOf "$tgz" "cgdm/${svc}/conf/version" | tr -d '[:space:]')"
            if [[ "$inner" != "$VERSION" ]]; then
              echo "::error::${svc} package version is ${inner}, expected ${VERSION}"
              exit 1
            fi
          done

      - name: Upload alone tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-alone.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload console tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-console.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 3

      - name: Upload sidecar tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-sidecar.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 3

  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: [meta, build-tgz]
    strategy:
      fail-fast: false
      matrix:
        service: ${{ fromJSON(needs.meta.outputs.services) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tgz artifact
        uses: actions/download-artifact@v8
        with:
          name: cgdm-${{ matrix.service }}.tar.gz
          path: docker-ctx

      - name: Stage docker build context
        run: |
          cp -r package/docker/shared docker-ctx/shared
          ls -lh docker-ctx

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Resolve image namespace
        id: namespace
        env:
          NAMESPACE: ${{ vars.DOCKERHUB_NAMESPACE || secrets.DOCKERHUB_USERNAME }}
        run: |
          set -euo pipefail
          if [[ -z "$NAMESPACE" ]]; then
            echo "::error::set the DOCKERHUB_USERNAME secret (or the DOCKERHUB_NAMESPACE variable)"
            exit 1
          fi
          echo "namespace=${NAMESPACE}" >> "$GITHUB_OUTPUT"

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: docker.io/${{ steps.namespace.outputs.namespace }}/${{ env.IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ needs.meta.outputs.version }}
            type=raw,value=latest,enable=${{ needs.meta.outputs.latest }}
          labels: |
            org.opencontainers.image.title=CloudDM ${{ matrix.service }}
            org.opencontainers.image.version=${{ needs.meta.outputs.version }}

      - name: Build and push ${{ matrix.service }}
        uses: nick-fields/retry@v4
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          LABELS: ${{ steps.meta.outputs.labels }}
          PLATFORMS: ${{ needs.meta.outputs.platforms }}
          SERVICE: ${{ matrix.service }}
        with:
          timeout_minutes: 90
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            set -euo pipefail
            tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
            done <<< "$TAGS"
            label_args=()
            while IFS= read -r label; do
              [[ -n "$label" ]] && label_args+=(--label "$label")
            done <<< "$LABELS"
            docker buildx build \
              --file "package/docker/${SERVICE}.Dockerfile" \
              --platform "$PLATFORMS" \
              --provenance=false \
              --push \
              --cache-from "type=gha,scope=docker-${SERVICE}" \
              --cache-to "type=gha,mode=max,scope=docker-${SERVICE}" \
              "${label_args[@]}" \
              "${tag_args[@]}" \
              docker-ctx

  notify:
    name: Notify Feishu
    runs-on: ubuntu-latest
    needs: [meta, build-tgz, docker]
    if: ${{ always() }}
    env:
      WEBHOOK: ${{ secrets.DOCKER_VERSION_FEISHU_BOT_WEBHOOK_URL }}
    steps:
      - name: Check notification webhook
        id: check
        run: |
          if [[ -n "${WEBHOOK}" ]]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "no DOCKER_VERSION_FEISHU_BOT_WEBHOOK_URL secret, skip notification"
          fi

      - name: Notification Feishu
        if: ${{ steps.check.outputs.enabled == 'true' }}
        uses: whatwewant/action-robot-feishu@v0.0.13
        with:
          url: ${{ env.WEBHOOK }}
          title: ${{ needs.docker.result == 'success' && '✅ Docker 发布' || '❌ Docker 发布' }}：${{ github.repository }}
          text: |
            版本: ${{ needs.meta.outputs.version }}
            服务: ${{ needs.meta.outputs.services }}
            平台: ${{ needs.meta.outputs.platforms }}
            分支: ${{ github.ref }}
            提交人: ${{ github.actor }}
            构建: ${{ needs.build-tgz.result }}
            镜像: ${{ needs.docker.result }}
            详情: https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}
