name: CD
run-name: Release ${{ inputs.version }}${{ inputs.latest && ' (latest)' || '' }}

on:
  workflow_dispatch:
    inputs:
      version:
        description: "version (e.g., 3.2.0 or 3.2.0-rc.1)"
        required: true
        type: string
      latest:
        description: "latest (publish Docker latest and mark the GitHub Release as Latest)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: cd
  cancel-in-progress: false

env:
  CHINA_REGISTRY: ${{ vars.CHINA_REGISTRY || 'cloudcanal-registry.cn-shanghai.cr.aliyuncs.com' }}
  CHINA_IMAGE_PREFIX: ${{ vars.CHINA_IMAGE_PREFIX || 'cloudcanal-registry.cn-shanghai.cr.aliyuncs.com/clougence/cgdm' }}
  GLOBAL_REGISTRY: ${{ vars.GLOBAL_REGISTRY || 'docker.io' }}
  GLOBAL_IMAGE_PREFIX: ${{ vars.GLOBAL_IMAGE_PREFIX || 'docker.io/bladepipe/cgdm' }}

jobs:
  build-tgz:
    name: Build tgz
    runs-on: ubuntu-latest
    env:
      CG_CLOUDDM_MAIN_VERSION: ${{ inputs.version }}
      ORG_GRADLE_PROJECT_parserTestParallelism: 8
      ORG_GRADLE_PROJECT_parserTestParallelForks: 2
      ORG_GRADLE_PROJECT_parserTestMaxHeapSize: 1g
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate release version
        env:
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          if [[ ! "$VERSION" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-(alpha|beta|rc)\.(0|[1-9][0-9]*))?$ ]]; then
            echo "::error::version must look like 3.2.0 or 3.2.0-rc.1"
            exit 1
          fi
          notes_file="docs/release-notes/v${VERSION}/index.en.md"
          if [[ "$LATEST" == "true" && ! -f "$notes_file" ]]; then
            echo "::error::release notes file does not exist: $notes_file"
            exit 1
          fi
          if [[ "$VERSION" == *-* && "$LATEST" == "true" ]]; then
            echo "::error::a prerelease version cannot be published as latest"
            exit 1
          fi
          if [[ "$LATEST" == "true" && "$REF_NAME" != "main" ]]; then
            echo "::error::latest can only be published from main"
            exit 1
          fi
          tag="v${VERSION}"
          tag_sha="$(git rev-parse --verify --quiet "refs/tags/${tag}^{}" || true)"
          head_sha="$(git rev-parse HEAD)"
          if [[ -n "$tag_sha" && "$tag_sha" != "$head_sha" ]]; then
            echo "::error::tag $tag points to $tag_sha, not the workflow commit $head_sha"
            exit 1
          fi

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5

      - name: Run backend tests
        working-directory: backend
        run: ./gradlew test --parallel --max-workers=4

      - name: Set up Node.js 22.22.1
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.1
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Cache built-in drivers bundle
        uses: actions/cache@v6
        with:
          path: package/pkg/builtin-drivers/bundle
          key: builtin-drivers-${{ hashFiles('package/pkg/builtin-drivers/built-in-drivers.xml') }}

      - name: Build tgz packages
        working-directory: package
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs=-Xmx8g
        run: ./package.sh --build

      - name: Upload alone tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-alone.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload console tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-console.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload sidecar tgz artifact
        uses: actions/upload-artifact@v7
        with:
          path: package/build/cgdm-sidecar.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  docker:
    name: Docker ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-tgz
    strategy:
      fail-fast: false
      matrix:
        service: [alone, console, sidecar]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tgz artifact
        uses: actions/download-artifact@v8
        with:
          name: cgdm-${{ matrix.service }}.tar.gz
          path: docker-ctx

      - name: Stage docker build context
        run: |
          cp -r package/docker/shared docker-ctx/shared
          ls -lh docker-ctx
          ls -R docker-ctx/shared

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v4

      - name: Log in to China registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CHINA_REGISTRY }}
          username: ${{ secrets.CGDM_DOCKER_CHINA_USERNAME }}
          password: ${{ secrets.CGDM_DOCKER_CHINA_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GLOBAL_REGISTRY }}
          username: ${{ secrets.CGDM_DOCKER_GLOBAL_USERNAME }}
          password: ${{ secrets.CGDM_DOCKER_GLOBAL_PASSWORD }}

      - name: Generate image tags
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: |
            ${{ env.CHINA_IMAGE_PREFIX }}-${{ matrix.service }}
            ${{ env.GLOBAL_IMAGE_PREFIX }}-${{ matrix.service }}
          tags: |
            type=raw,value=${{ inputs.version }}
            type=raw,value=latest,enable=${{ inputs.latest }}

      - name: Build and push ${{ matrix.service }}
        uses: nick-fields/retry@v4
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
          SERVICE: ${{ matrix.service }}
        with:
          timeout_minutes: 60
          max_attempts: 3
          retry_wait_seconds: 30
          command: |
            tag_args=()
            while IFS= read -r tag; do
              [[ -n "$tag" ]] && tag_args+=(--tag "$tag")
            done <<< "$TAGS"
            docker buildx build \
              --file "package/docker/${SERVICE}.Dockerfile" \
              --platform linux/amd64,linux/arm64 \
              --provenance=false \
              --push \
              --cache-from "type=gha,scope=docker-${SERVICE}" \
              --cache-to "type=gha,mode=max,scope=docker-${SERVICE}" \
              "${tag_args[@]}" \
              docker-ctx

  export-images:
    name: Export images ${{ matrix.arch }}
    runs-on: ubuntu-latest
    needs: [build-tgz, docker]
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, arm64]
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      # The three tgz artifacts are named cgdm-alone.tar.gz / cgdm-console.tar.gz / cgdm-sidecar.tar.gz.
      # Merge them into one context dir so all three Dockerfiles can build from it.
      - name: Download tgz artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cgdm-*.tar.gz
          merge-multiple: true
          path: docker-ctx

      - name: Stage docker build context
        run: cp -r package/docker/shared docker-ctx/shared

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Expose GitHub Actions runtime for buildx cache
        uses: crazy-max/ghaction-github-runtime@v4

      # The base image lives in the private China registry; needed to pull on a cache miss.
      - name: Log in to China registry
        uses: docker/login-action@v4
        with:
          registry: ${{ env.CHINA_REGISTRY }}
          username: ${{ secrets.CGDM_DOCKER_CHINA_USERNAME }}
          password: ${{ secrets.CGDM_DOCKER_CHINA_PASSWORD }}

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          registry: ${{ env.GLOBAL_REGISTRY }}
          username: ${{ secrets.CGDM_DOCKER_GLOBAL_USERNAME }}
          password: ${{ secrets.CGDM_DOCKER_GLOBAL_PASSWORD }}

      - name: Build, save and gzip images
        env:
          VERSION: ${{ inputs.version }}
          ARCH: ${{ matrix.arch }}
          IMAGE_PREFIX: ${{ env.GLOBAL_IMAGE_PREFIX }}
        run: |
          set -euo pipefail
          case "$ARCH" in
            x86_64) platform=linux/amd64 ;;
            arm64)  platform=linux/arm64 ;;
          esac
          for svc in alone console sidecar; do
            docker buildx build \
              --file "package/docker/${svc}.Dockerfile" \
              --platform "$platform" \
              --provenance=false \
              --load \
              --cache-from "type=gha,scope=docker-${svc}" \
              --tag "${IMAGE_PREFIX}-${svc}:${VERSION}" \
              docker-ctx
          done
          docker pull --platform "$platform" mysql:8.0
          mkdir -p out
          docker save "${IMAGE_PREFIX}-alone:${VERSION}" \
            | gzip > "out/cgdm-alone-image-${ARCH}.tar.gz"
          docker save "${IMAGE_PREFIX}-console:${VERSION}" "${IMAGE_PREFIX}-sidecar:${VERSION}" mysql:8.0 \
            | gzip > "out/cgdm-cluster-image-${ARCH}.tar.gz"

      - name: Upload alone image artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/cgdm-alone-image-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

      - name: Upload cluster image artifact
        uses: actions/upload-artifact@v7
        with:
          path: out/cgdm-cluster-image-${{ matrix.arch }}.tar.gz
          archive: false
          if-no-files-found: error
          retention-days: 14

  release:
    name: Publish GitHub Release
    runs-on: ubuntu-latest
    needs: [build-tgz, docker, export-images]
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Download tgz artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: cgdm-*.tar.gz
          merge-multiple: true
          path: release-assets

      - name: Generate release deployment yml assets
        env:
          VERSION: ${{ inputs.version }}
          IMAGE_PREFIX: ${{ env.GLOBAL_IMAGE_PREFIX }}
          IMAGE_TAG: ${{ inputs.version }}
        run: |
          set -euo pipefail
          for name in alone cluster; do
            for kind in docker k8s; do
              src="package/docker/${kind}-${name}.yml"
              dst="release-assets/${kind}-${name}-${VERSION}.yml"
              if [[ ! -f "$src" ]]; then
                echo "::error::deployment template does not exist: $src"
                exit 1
              fi
              IMAGE_PREFIX="$IMAGE_PREFIX" IMAGE_TAG="$IMAGE_TAG" \
                perl -pe 's/__IMAGE_PREFIX__/$ENV{IMAGE_PREFIX}/g; s/__IMAGE_TAG__/$ENV{IMAGE_TAG}/g' "$src" > "$dst"
              if grep -Eq '__IMAGE_PREFIX__|__IMAGE_TAG__' "$dst"; then
                echo "::error::deployment yml still contains image placeholders: $dst"
                exit 1
              fi
            done
          done

      - name: Create release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ inputs.version }}
          LATEST: ${{ inputs.latest }}
          PRERELEASE: ${{ contains(inputs.version, '-') }}
          TARGET_SHA: ${{ github.sha }}
        run: |
          shopt -s nullglob
          assets=(
            release-assets/cgdm-*.tar.gz
            release-assets/docker-*.yml
            release-assets/k8s-*.yml
          )

          tag="v${VERSION}"
          notes_file="docs/release-notes/v${VERSION}/index.en.md"
          notes_args=()
          if [[ -f "$notes_file" ]]; then
            notes_args+=(--notes-file "$notes_file")
          else
            notes_args+=(--notes "Release $tag")
          fi
          gh release create "$tag" "${assets[@]}" \
            --target "$TARGET_SHA" \
            --title "$tag" \
            "${notes_args[@]}" \
            --prerelease="$PRERELEASE" \
            --latest="$LATEST"
