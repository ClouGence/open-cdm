plugins {
    id 'com.clougence.java-conventions'
}

dependencies {
    implementation 'com.knuddels:jtokkit:1.1.0'
    implementation project(':ai-common')
    implementation project(':ai-openai')
    implementation project(':ai-deepseek')
    implementation project(':ai-kimi')
    implementation project(':ai-minimax')
    implementation project(':ai-dashscope')
    implementation project(':cgdm-console')
    implementation project(':cgdm-dao')
    implementation project(':cgdm-share-libs')
    implementation project(':cg-schema')
    implementation "com.google.guava:guava:${GUAVA_VERSION}"
    implementation "org.springframework.boot:spring-boot-starter-web:${SPRINGBOOT_VERSION}"
    implementation "org.springframework.boot:spring-boot-starter-validation:${SPRINGBOOT_VERSION}"
}

description = 'CloudDM AI SQL assistant'
