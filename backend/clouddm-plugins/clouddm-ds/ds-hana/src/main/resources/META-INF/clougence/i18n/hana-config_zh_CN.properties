CONFIG_HANA_DATABASE_LABEL=租户数据库
CONFIG_HANA_DATABASE_DESC=可选，填写目标业务租户名，例如 HXE；不是 schema。直连租户 SQL 端口时可留空。
CONFIG_HANA_HOST_DESC=填写目标租户 SQL 地址和实际端口。30015 仅为实例 00 的常见默认值；Express 示例 HXE 为 39015，SYSTEMDB 为 39013，以部署结果为准。
CONFIG_HANA_TLS_HOST_LABEL=证书主机名
CONFIG_HANA_TLS_HOST_DESC=校验证书中的服务器身份，留空时校验连接地址。SSH 加证书校验时必填原服务器证书中的主机名，不允许通配符。
CONFIG_HANA_URL_LABEL=自定义 JDBC 地址
CONFIG_HANA_URL_DESC=可选，覆盖地址/端口，例如 jdbc:sap://host:39015/。仅支持单一端点，不允许 URL 参数、凭据或与 SSH 同时使用；数据库、schema、超时和 TLS 使用对应字段。
CONFIG_HANA_URL_ERROR=HANA 连接地址无效；请使用单一主机及有效端口，JDBC URL 不得包含参数或凭据。
CONFIG_HANA_URL_SSH_ERROR=HANA 自定义 JDBC 地址不能与 SSH 同时使用；请使用地址和端口字段。
CONFIG_HANA_TLS_HOST_REQUIRED=通过 SSH 校验 HANA TLS 证书时必须填写证书主机名。
CONFIG_HANA_TLS_HOST_ERROR=HANA 证书主机名不能包含通配符。
CONFIG_HANA_TLS_FILE_REQUIRED=HANA TLS 证书文件未就绪，请检查证书配置与执行节点。
CONFIG_HANA_TIMEOUT_ERROR=HANA 连接超时必须为 0–2147483647 毫秒，通信超时必须为 0–2147483 秒；0 表示不限制。
CONFIG_HANA_CATALOG_MISMATCH=请求的数据库与实际连接的 HANA 租户不一致，请连接目标租户。
CONFIG_HANA_CATALOG_UNSUPPORTED=不支持在连接内切换 HANA 租户，请连接目标租户。
CONFIG_HANA_ISOLATION_UNSUPPORTED=HANA 不支持 READ UNCOMMITTED 隔离级别。
