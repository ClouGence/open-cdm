CONFIG_HANA_DATABASE_LABEL=Tenant database
CONFIG_HANA_DATABASE_DESC=Optional, e.g. HXE / SYSTEMDB.
CONFIG_HANA_TLS_HOST_LABEL=Certificate hostname
CONFIG_HANA_TLS_HOST_DESC=Server identity to verify in the certificate; empty uses the connection hostname. Required with SSH and certificate validation. Use the original server certificate hostname, without wildcards.
CONFIG_HANA_URL_LABEL=Custom JDBC endpoint
CONFIG_HANA_URL_DESC=Optional override, e.g. jdbc:sap://host:39015/. Single endpoint only, without URL parameters or credentials; cannot be combined with SSH. Use separate fields for database, schema, timeouts and TLS.
CONFIG_HANA_URL_ERROR=Invalid HANA endpoint. Use a single host and valid port; JDBC URLs must not contain parameters or credentials.
CONFIG_HANA_URL_SSH_ERROR=HANA custom JDBC endpoints cannot be combined with SSH; use the address and port fields.
CONFIG_HANA_TLS_HOST_REQUIRED=A certificate hostname is required to validate HANA TLS over SSH.
CONFIG_HANA_TLS_HOST_ERROR=HANA certificate hostname must not contain wildcards.
CONFIG_HANA_TLS_FILE_REQUIRED=HANA TLS certificate files are not ready. Check the certificate configuration and execution node.
CONFIG_HANA_TIMEOUT_ERROR=HANA connection timeout must be 0–2147483647 milliseconds and communication timeout 0–2147483 seconds; 0 means no limit.
CONFIG_HANA_CATALOG_MISMATCH=The requested database does not match the connected HANA tenant. Open a connection to the target tenant.
CONFIG_HANA_CATALOG_UNSUPPORTED=Changing the HANA tenant within a connection is not supported. Open a connection to the target tenant.
CONFIG_HANA_ISOLATION_UNSUPPORTED=HANA does not support the READ UNCOMMITTED isolation level.
