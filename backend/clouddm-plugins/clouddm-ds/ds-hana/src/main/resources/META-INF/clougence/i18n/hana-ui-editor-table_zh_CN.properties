PLUGIN_NAME_HANA=SAP HANA
#
UI_EDITOR_INDEXES_INDEX_TYPE_TITLE=索引方式
UI_EDITOR_INDEXES_INDEX_TYPE_DESC=选择普通索引或唯一索引；索引类型单独设置。
UI_EDITOR_INDEXES_TYPE_BTREE_LABEL=BTREE
UI_EDITOR_INDEXES_TYPE_CPBTREE_LABEL=CPBTREE
UI_EDITOR_INDEXES_TYPE_INVERTED_LABEL=INVERTED
UI_EDITOR_INDEXES_TYPE_INVERTED_VALUE_LABEL=INVERTED VALUE
UI_EDITOR_INDEXES_TYPE_INVERTED_HASH_LABEL=INVERTED HASH
UI_EDITOR_INDEXES_TYPE_INVERTED_INDIVIDUAL_LABEL=INVERTED INDIVIDUAL
UI_EDITOR_INDEXES_TYPE_GEOCODE_LABEL=GEOCODE
UI_EDITOR_INDEXES_TYPE_FULLTEXT_LABEL=FULLTEXT
UI_EDITOR_COMM_COLUMNS_ORDER_TITLE=排序方式
UI_EDITOR_COMM_COLUMNS_ORDER_DESC=指定索引值是按升序存储还是降序存储。如果没有指定顺序说明符，默认值为升序。散列索引不允许使用 ASC 和 DESC。
UI_EDITOR_COMM_COLUMN_ORDER_ASC_LABEL=升序(ASC)
UI_EDITOR_COMM_COLUMN_ORDER_DESC_LABEL=降序(DESC)
UI_EDITOR_COLUMNS_AUTOINCREMENT_TITLE=自增
UI_EDITOR_COLUMNS_AUTOINCREMENT_DESC=新列使用 GENERATED BY DEFAULT AS IDENTITY；已有生成列只支持单独修改注释。
#
HANA_EDITOR_TABLE_STORAGE_TITLE=存储类型
HANA_EDITOR_TABLE_STORAGE_DESC=行存/列存转换可能重建表并持有锁，请先预览 SQL。
HANA_EDITOR_TABLE_ROW_LABEL=行存（ROW）
HANA_EDITOR_TABLE_COLUMN_LABEL=列存（COLUMN）
UI_EDITOR_COLUMN_DEFAULT_CUSTOM_DESC=输入 SQL 默认值表达式；字符串须加单引号，例如 'abc'；支持数字、CURRENT_TIMESTAMP 等。

HANA_SCRIPT_UNSUPPORTED=不支持获取此 HANA 对象的脚本：{0}。
HANA_TABLE_TYPE_UNSUPPORTED=不支持的 HANA 表类型：{0}。
HANA_INDEX_NATIVE_DDL=请使用原生 DDL 编辑此 HANA 索引类型：{0}。
HANA_TRIGGER_NATIVE_DDL=请使用完整的原生 HANA DDL 编辑触发器。
HANA_PAGE_RANGE_INVALID=HANA 分页范围无效。
HANA_COLUMN_UNKNOWN=HANA 列不存在：{0}。请刷新后重试。
HANA_COLUMN_READ_ONLY=HANA 列为只读：{0}。
HANA_NO_INSERT_COLUMN=此 HANA 表没有可插入值的列。
HANA_COLUMN_NOT_EDITABLE=无法编辑 HANA 列：{0}。
HANA_NO_UPDATE_COLUMN=没有需要更新的 HANA 列。
HANA_ROW_KEY_MISSING=缺少 HANA 行定位字段：{0}。请刷新后重试。
HANA_ROW_KEY_REQUIRED=HANA 数据编辑要求表具有主键或所有键列均非空的唯一键。
HANA_AFFECTED_ROWS_UNEXPECTED=预期修改 1 行，实际影响 {0} 行；请先刷新并核实结果，再决定是否重试。
HANA_GENERATION_NATIVE_DDL=修改 HANA 列生成方式需要使用原生 DDL。
HANA_GENERATED_PROPERTIES_NATIVE_DDL=修改 HANA 生成列属性需要使用原生 DDL。
HANA_DECIMAL_SCALE_INVALID=HANA DECIMAL 的精度必须大于或等于小数位数。
HANA_TYPE_UNSUPPORTED=不支持的 HANA SQL 类型：{0}。
HANA_TYPE_PARAMETER_RANGE=HANA 类型参数 {0} 超出范围（{1}–{2}）。
HANA_CHECK_NATIVE_DDL=请使用原生 DDL 保留 HANA 检查约束。
HANA_CONSTRAINT_CONVERSION=转换到 {0} 时无法保留 HANA 外键或检查约束，请手动编写目标 DDL。
HANA_INDEX_CONVERSION=转换到 {0} 时无法保留 HANA 键或索引，请手动编写目标 DDL。
HANA_GENERATED_CONVERSION=请为 HANA 生成列 {0} 明确指定目标列定义。
HANA_DECIMAL_CONVERSION=请为 HANA 浮动精度小数列 {0} 明确指定目标精度。
HANA_LENGTH_CONVERSION=转换到 {0} 时无法保留 HANA 列 {1} 的长度，请明确指定目标列定义。
