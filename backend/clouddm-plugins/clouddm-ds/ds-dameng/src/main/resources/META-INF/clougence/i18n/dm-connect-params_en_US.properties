CG_JDBC_PARAMS_DM_unixSocketFile=In a LINUX system, when the UNIXSOCET UNIX-IPC mode is used to communicate between the server and the client, the UNIXSOCKET path file name is used to specify the client connection. When using unixSocketFile, there is no need to specify host and port. \n\
  For example: jdbc:dm://?user=SYSDBA&password=SYSDBA&unixSocketFile=/home/te/foo.sock
CG_JDBC_PARAMS_DM_user=Login user
CG_JDBC_PARAMS_DM_password=Login password
CG_JDBC_PARAMS_DM_appName=Client application name
CG_JDBC_PARAMS_DM_osName=Operating system name
CG_JDBC_PARAMS_DM_socketTimeout=Network communication link timeout; unit ms, value range 0~2147483647, 0 means no limit; the default is 0
CG_JDBC_PARAMS_DM_sessionTimeout=Session timeout; unit ms, value range 0~2147483647, 0 means no limit; default is 0
CG_JDBC_PARAMS_DM_connectTimeout=Timeout for connecting to the database; unit ms, value range 0~2147483647, 0 means no limit; default is 5000
CG_JDBC_PARAMS_DM_StmtPoolSize=Statement handle pool size; value range 0~2147483647, 0 means closed; default is 15
CG_JDBC_PARAMS_DM_PStmtPoolSize=Prepare statement handle pool size; value range 0~2147483647, 0 means closed; default is 0
CG_JDBC_PARAMS_DM_pstmtPoolValidTime=Validity time of prepare statement cache; unit ms, value range 0~2147483647, 0 means no limit; default is 0
CG_JDBC_PARAMS_DM_escapeProcess=Whether to perform syntax escape processing; the value is 1/0 or true/false; the default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_autoCommit=Whether to automatically submit; the value is 1/0 or true/false; the default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_alwayseAllowCommit=When the automatic submission switch is turned on, whether calling the rollback() interface will not report an error; the value is 1/0 or true/false; the default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_localTimezone=Specify the client's local time zone. For time types related to the local time zone, the conversion between the server time zone and the local time zone will be automatically completed; the unit is minutes, and the value range is -779~840; the default is the current system time zone.
CG_JDBC_PARAMS_DM_maxRows=There is a limit on the number of rows in the result set. If the upper limit is exceeded, the result set will be truncated; the value range is 0~2147483647, 0 means no limit; the default is 0
CG_JDBC_PARAMS_DM_bufPrefetch=Result set fetch prefetch message buffer size; unit KB, value range 32~65535. The default is 0, which means it is configured according to the server. If fetchSize is specified on the result set, the size will be automatically estimated.
CG_JDBC_PARAMS_DM_LobMode=Large field data acquisition mode; 1 means to obtain the data from the server segment when getting data, 2 means to cache the large field data completely locally when the result set is generated; the default is 1
CG_JDBC_PARAMS_DM_ignoreCase=Whether the result set column names ignore case; value 1/0 or true/false; default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_continueBatchOnError=Whether to continue execution when an error occurs in batch execution; default is false; value (true/True, false/False); true/True: yes, false/False: no
CG_JDBC_PARAMS_DM_batchType=Batch mode; 1 means batch binding execution, 2 means line-by-line execution; the default is 1
CG_JDBC_PARAMS_DM_resultSetType=Specifies the default result set type to create, corresponding to the result set type in the Java standard; the value is 1003/1004/1005, and the default is 1003;\n\
1003: Corresponds to ResultSet.TYPE_FORWARD_ONLY;\n1004: Corresponds to ResultSet.TYPE_SCROLL_INSENSITIVE;\n1005: Corresponds to ResultSet.TYPE_SCROLL_SENSITIVE
CG_JDBC_PARAMS_DM_dbmdChkPrv=Whether the catalog function performs permission detection; the value is 1/0 or true/false; the default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_isBdtaRS=Whether to use column mode result set, the synchronization server needs to enable this function; the value is 1/0 or true/false; the default is true; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_clobAsString=The clob type column calls getColumnType() of resultSetMetaData and is mapped to the Types.VARCHAR type; the value is 1/0 or true/false; the default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_columnNameCase=Case conversion of result set column names. The value is upper/lower/null value, and the default is null value. upper means converting to uppercase; lower means converting to lowercase; a null value means leaving unchanged
CG_JDBC_PARAMS_DM_compatible_mode=Compatible with other databases. The value is the database name: oracle means compatible with Oracle, oracle19 means compatible with Oracle 19c, mysql means compatible with Mysql. This parameter has the same name as COMPATIBLE_MODE in DM.INI, but has different uses.
CG_JDBC_PARAMS_DM_schema=Specifies the current mode after the user logs in. The default mode is the user's default mode.
CG_JDBC_PARAMS_DM_loginMode=Specify the server mode for priority login. The value range is 0~4; 0: Priority is given to connecting to libraries in PRIMARY mode, followed by NORMAL mode, and finally STANDBY mode is selected; \
1: Only connect to the main library; 2: Only connect to the standby library; 3: Priority is given to connecting to the library in STANDBY mode, followed by PRIMARY mode, and finally NORMAL mode is selected; 4: Priority is given to connecting to the library in NORMAL mode, followed by PRIMARY mode, and finally STANDBY mode is selected; the default is 4\n\
When read-write separation is enabled (that is, rwSeparate is not 0), loginMode does not take effect
CG_JDBC_PARAMS_DM_loginStatus=When connecting to the database using the service name method, only libraries with matching status are selected; the value range is 0, 3~5; 0 means no limit; 3 means mount state; 4 means open state; 5 means suspend state; the default is 0
CG_JDBC_PARAMS_DM_loginDscCtrl=When the service name connects to the database, only the library of the dsc control node is selected; the value is 1/0 or true/false; the default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_epSelector=Service name: Which model is used to establish a connection when connecting to the database; 0 means selecting different nodes in the list in order to establish a connection, so that all connections are evenly distributed on each node; 1 means selecting the frontmost node in the list to establish a connection, and only when the current node cannot establish a connection, the next node will be selected for connection; the default is 0
CG_JDBC_PARAMS_DM_autoReconnect=Connection processing strategies when connection exceptions occur or in some special scenarios. The value range is 0~7; 0: Close the connection; 1: Automatically switch to other libraries when an exception occurs in the connection. Regardless of whether the switch is successful or failed, a SQLException will be thrown to notify the upper application to perform relevant processing when transaction execution fails; 2: Used with epSelector=1, \
If the node at the front of the service name list is restored, switch the current connection to the previous node; 4: Maintain dynamic balance of sessions on each node, detect changes in the number of nodes and sessions through background threads, and switch connections to maintain balance. You can also set autoReconnect to a combination of the above values ​​to indicate multiple configurations at the same time. For example, setting it to 3 indicates configuring 1 and 2 at the same time; the default is 0
CG_JDBC_PARAMS_DM_switchTimes=When the service name connects to the database, if no library that meets the conditions is found and the connection is successfully established, the number of times it will be tried to traverse the library list in the service name; the value range is 1~2147483647; the default is 1
CG_JDBC_PARAMS_DM_switchInterval=When the service name connects to the database, if all library lists in the service name are traversed and no qualified library is found to successfully establish the connection, wait for a certain period of time before continuing the next traversal; the unit is ms, the value range is 0~2147483647; the default is 1000
CG_JDBC_PARAMS_DM_cluster=The type of cluster used for identification. \nDW: active and backup;\nRW: read and write separation;\nMPP: massive parallel processing cluster;\nDPC: distributed computing cluster;\nDSC: shared storage cluster. cluster=DSC must be used in conjunction with autoReconnect=2 and epSelector=1 to detect whether the DSC cluster node failure recovery is successful.
CG_JDBC_PARAMS_DM_dbAliveCheckFreq=How often to check whether the database is alive. The unit is ms, the value range is 0~2147483647, 0 means no detection; the default is 0
CG_JDBC_PARAMS_DM_compress=Whether to compress messages. The value range is 0~2. 0 means no compression; 1 means full compression; 2 means optimized compression; the default is 0
CG_JDBC_PARAMS_DM_compressID=Message compression algorithm identification, which is ultimately determined through negotiation with server support. 0 means zip; 1 means snappy; default is 0
CG_JDBC_PARAMS_DM_sslFilesPath=Enable SSL communication encryption on the database side. This parameter specifies the path to the SSL encrypted file.
CG_JDBC_PARAMS_DM_sslKeystorePass=Enable SSL communication encryption on the database side. This parameter specifies the command for SSL encrypted files.
CG_JDBC_PARAMS_DM_kerberosLoginConfPath=The user name plus the prefix "///" indicates that Kerberors authentication is enabled. This parameter specifies the path to the Kerberors authentication login configuration file.
CG_JDBC_PARAMS_DM_uKeyName=Ukey's username
CG_JDBC_PARAMS_DM_uKeyPin=Ukey's password
CG_JDBC_PARAMS_DM_cipherPath=The path of the third-party encryption algorithm engine
CG_JDBC_PARAMS_DM_OsAuthType=Specify the operating system authentication user type. When operating system authentication is enabled, the user name uses the system user name. The value range is 0~4; 0 means closed; 1 means DBA; 2 means SSO; 3 means AUDITOR; 4 means adaptive. Default is 0
CG_JDBC_PARAMS_DM_loginCertificate=Specify the path where the login encryption username and password public key is located. Once configured, it is considered that the client's certificate encryption username and password mode is enabled.
CG_JDBC_PARAMS_DM_mppLocal=Whether MPP local connection; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_rwSeparate=Whether to use a read-write separation system. 0 means not enabled; 1 means enabled; 2 means enabled, the standby database is selected by the client, and only the node configured in the service name will be selected; 4 means enabled, the standby database is selected by the client, and only the transaction consistency standby database is connected. The default is 0\nWhen read-write separation is enabled, loginMode is invalid
CG_JDBC_PARAMS_DM_rwPercent=The percentage of transactions distributed to the primary database to the total transactions in the primary and standby databases; unit %, value range 0~100; default is 25
CG_JDBC_PARAMS_DM_rwAutoDistribute=Whether the read-write separation system transaction distribution is automatically managed by JDBC; value 1/0 or true/false; default is true; 1/true: yes, false: transaction distribution is managed by the user, the user can mark the transaction as a read-only transaction by setting the readOnly attribute on the connection
CG_JDBC_PARAMS_DM_rwHA=Whether to enable read-write separation system high availability; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_rwStandbyRecoverTime=Read-write separation system standby database failure recovery detection interval, unit ms, value range 0~2147483647, 0 means no reply; the default is 60000
CG_JDBC_PARAMS_DM_enRsCache=Whether to enable result set caching; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_rsCacheSize=Set the result set buffer size in MB. The value range is 1~65535. If the setting is too large, it may cause space allocation failure, thereby invalidating the cache.
CG_JDBC_PARAMS_DM_rsRefreshFreq=Frequency of result set cache check for updates, unit S, value range 0~10000, if set to 0, there is no need to check for updates
CG_JDBC_PARAMS_DM_keyWords=Identifies user keywords. All strings in the list. If they appear in the sql statement as a word, the word will be enclosed in double quotes; the default is an empty string.
CG_JDBC_PARAMS_DM_logDir=The directory where logs and other JDBC process files are generated, defaults to the current working directory of jvm
CG_JDBC_PARAMS_DM_logLevel=The level of log generation, the logs are as follows from low to high (off: no recording; error: only error logs are recorded; warn: warning information is recorded; sql: sql execution information is recorded; info: all execution information is recorded; all: all are recorded), high levels record low-level information at the same time; the default is off
CG_JDBC_PARAMS_DM_logFlushFreq=Log flushing frequency; unit s, valid value range 0~2147483647; default is 60
CG_JDBC_PARAMS_DM_statEnable=Whether to enable status monitoring; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_statDir=The directory where status monitoring information is output in the form of text files. The default is the current working directory of jvm.
CG_JDBC_PARAMS_DM_statFlushFreq=Status monitoring statistical information writing file flushing frequency; unit s, value range 0~2147483647; 0 means no file writing; the default is 10
CG_JDBC_PARAMS_DM_statSlowSqlCount=Count the number of slow SQL top rows; the value range is 0~1000; the default is 100
CG_JDBC_PARAMS_DM_statHighFreqSqlCount=Count the number of high-frequency SQL top rows; the value range is 0~1000; the default is 100
CG_JDBC_PARAMS_DM_statSqlMaxCount=Status monitoring can count the number of different SQLs; the value range is 0~100000; the default is 100000
CG_JDBC_PARAMS_DM_statSqlRemoveMode=The elimination method used when the number of executed different SQLs exceeds statSqlMaxCount; the value is latest/eldest; latest means to eliminate the most recently executed SQL, and eldest means to eliminate the oldest SQL; the default is eldest
CG_JDBC_PARAMS_DM_dmsvcconf=Specify the path where the url attribute configuration file is located
CG_JDBC_PARAMS_DM_dbAliveCheckTimeout=The connection timeout time for detecting whether the database is alive. If the connection is not successful within this time, the database is considered to be faulty; unit ms, value range 1~2147483647; default is 10000
CG_JDBC_PARAMS_DM_checkFreq=When the service name connects to the database, it loops to check whether the connection needs to be reset. That is, it detects whether the connection object changes every set time. If the connection object changes, the JDBC connection will automatically reset to the new object. The unit is ms, the value range is 0~2147483647. The default value is 300000
CG_JDBC_PARAMS_DM_prepareOptimize=Whether to optimize precompiled SQL; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_allowRange=The percentage of the allowed dynamic load balancing error range. The larger the percentage, the larger the allowed error range. The value range is 0~50. Default is 5
CG_JDBC_PARAMS_DM_localEncrypt=Whether to enable local encryption of username and password; value 1/0 or true/false; default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_localEncryptEngine=Local encryption engine name. If not specified, the system's built-in encryption engine will be used. Users can specify a custom encryption engine.
CG_JDBC_PARAMS_DM_genKeyNameCase=When calling the preparedStatement(String sql, String[] columnName) interface prepare sql, you can specify the column name at the same time, which is used to return the specified column value after the table data is added, deleted, or modified. This parameter is used to specify the case of the column names here. \
Values ​​0/1/2 or none/upper/lower; default is upper. Value 0 or none: keep user input unchanged; 1 or upper: convert user input to uppercase; 2 or lower: convert user input to lowercase
CG_JDBC_PARAMS_DM_afterGetMoreResults=Whether to close the previous result set after calling the JDBC standard interface getMoreResults(); value 1/2/3; default is 1; 1: Close the current result set; 2: Keep the current result set open; 3: Close all current result sets
CG_JDBC_PARAMS_DM_checkExecType=Whether to check whether the SQL statement type executed by the executeXXX interface matches the interface; the value is 1/0 or true/false; the default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_quoteReplace=Whether to change the double quotes in the SQL statement to single quotes; the value is 1/0 or true/false; the default is false; 1/true: yes, 0/false: no
CG_JDBC_PARAMS_DM_ignoreWarnings=Used to set to ignore specified SQLWarnings, the value and meaning are as follows: \nall: ignore all warnings; \nsqlCode: ignore specified warnings; \nop sqlCode: ignore warnings that meet the conditions, op can be symbols >, <, >=, <=, !; \n(sqlCode,sqlCode): ignore multiple specified warnings, the default is empty
CG_JDBC_PARAMS_DM_paramBindMode=Used to set the parameter binding type, the value is 1/0, the default is 0. 0: When the parameter is of the recommended type, it is bound according to the user type; 1: When the parameter is of the recommended type, it is bound according to the server's recommended type.
