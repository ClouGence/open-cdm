GREPTIMEDB_CONFIG_DECODE_ERROR=无法读取 GreptimeDB 连接配置
GREPTIMEDB_SOCKET_TIMEOUT_DESC=等待服务器返回数据的超时时间，单位为秒
GREPTIMEDB_CONNECT_TIMEOUT_INVALID=连接超时必须为 1 到 2147483647 毫秒之间的整数
GREPTIMEDB_SOCKET_TIMEOUT_INVALID=读超时必须为 1 到 2147483 秒之间的整数
GREPTIMEDB_TRANSACTIONS_UNSUPPORTED=GreptimeDB 不支持手动事务
SUPPORT_LEVEL_HINT_FOR_CANCEL_QUERY=取消查询会关闭当前连接，请重新打开会话后继续执行。
GREPTIMEDB_QUERY_CANCELLED=查询已取消，请重新打开会话。
GREPTIMEDB_QUERY_TIMEOUT=查询超时，请重新打开会话。
GREPTIMEDB_READ_TIMEOUT=读取数据超时，请重新打开会话。
GREPTIMEDB_CONNECTION_LOST=数据库连接已断开，当前语句的执行结果未知。请重新打开会话。
GREPTIMEDB_SESSION_DISCONNECTED=当前连接已关闭，请重新打开会话。
GREPTIMEDB_DUPLICATE_COLUMN=结果包含重名列，请为 {0} 使用不同的别名。
