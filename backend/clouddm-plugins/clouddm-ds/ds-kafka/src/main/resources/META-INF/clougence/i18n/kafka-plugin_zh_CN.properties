PLUGIN_NAME_KAFKA=Kafka
KAFKA_AUTH_READ=读取消息与元数据
KAFKA_AUTH_MANAGE=管理 Topic
KAFKA_SESSION_BUSY=Kafka 会话正在执行操作。
KAFKA_SESSION_CLOSED=Kafka 会话已关闭。
KAFKA_SESSION_READ_ONLY=Kafka 会话为只读，不允许管理操作。
KAFKA_SESSION_UNSUPPORTED=Kafka 不支持 JDBC 回调、SQL 执行模式、事务、Catalog 或 Schema 操作。
KAFKA_QUERY_CANCELLED=Kafka 命令已中断。已提交的管理请求可能仍在 Broker 执行，请核实结果后再重试。
KAFKA_METADATA_UNSUPPORTED=Kafka 元数据浏览尚未接入。
KAFKA_QUERY_TIMEOUT=Kafka 请求超时。管理操作可能已生效，请核实结果后再重试。
KAFKA_RESULT_TRUNCATED=结果达到系统条数或大小上限，后续行已省略。限制仅影响结果输出，不缩小管理操作范围或 lag 汇总范围。
KAFKA_TOPIC_NOT_FOUND=没有匹配的 Topic：{0}
KAFKA_TOPIC_DELETE_FAILED=Topic 删除失败或未全部完成。请查看各 Topic 的 STATUS 和 ERROR；UNKNOWN 结果需核实后再重试。
KAFKA_CONSUMER_LIMIT_REQUIRED=请配置正数的系统获取条数上限，或通过 --max-messages 指定有界消费条数。
KAFKA_CONSUMER_IDLE_TIMEOUT={0} 毫秒内没有收到新消息，消费已结束，已收到的消息保留。
KAFKA_CONSUMER_BOUNDS_REWRITE=补齐 Kafka 消费条数与超时并应用条数上限
KAFKA_PARTITION_NOT_FOUND=分区不存在：{0}-{1}
