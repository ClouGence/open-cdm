PLUGIN_NAME_KAFKA=Kafka
KAFKA_AUTH_READ=Read messages and metadata
KAFKA_AUTH_MANAGE=Manage topics and consumer groups
KAFKA_SESSION_BUSY=The Kafka session is busy.
KAFKA_SESSION_CLOSED=The Kafka session is closed.
KAFKA_SESSION_READ_ONLY=The Kafka session is read-only.
KAFKA_SESSION_UNSUPPORTED=Kafka does not support JDBC callbacks, SQL execution modes, transactions, catalogs or schemas.
KAFKA_QUERY_CANCELLED=The Kafka command was interrupted. Submitted management requests may still execute on the broker; verify their outcome before retrying.
KAFKA_COMMAND_UNSUPPORTED=Kafka message consumption is not yet available.
KAFKA_METADATA_UNSUPPORTED=Kafka metadata browsing is not yet available.
KAFKA_QUERY_TIMEOUT=Kafka request timed out. Management operations may have taken effect; check their outcome before retrying.
KAFKA_RESULT_TRUNCATED=The result reached the system row or byte limit; remaining rows are omitted. Limits affect display, not the scope of management operations or lag summaries.
KAFKA_TOPIC_NOT_FOUND=No topics match: {0}
KAFKA_GROUP_NOT_FOUND=Consumer group does not exist: {0}
KAFKA_TOPIC_DELETE_FAILED=Topic deletion failed or is incomplete. Check per-topic STATUS and ERROR; UNKNOWN outcomes must be verified before retrying.
