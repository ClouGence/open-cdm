KAFKA_CONSUMER_IDLE_TIMEOUT=No message arrived within {0} ms. Consumption ended; received messages are retained.
KAFKA_CONSUMER_BOUNDS_REWRITE=Apply Kafka message count and timeout bounds
KAFKA_PARTITION_NOT_FOUND=Partition does not exist: {0}-{1}
KAFKA_EFFECTIVE_COMMAND=Effective command: {0}
KAFKA_CONSUMER_LIMIT_REACHED=Consumed {0} messages. The effective --max-messages limit was reached; consumption ended.
