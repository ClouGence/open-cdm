CONFIG_KAFKA_BROKERS_LABEL=Bootstrap Brokers
CONFIG_KAFKA_BROKERS_DESC=逗号分隔的 host:port，例如 broker1:9092,broker2:9092 或 [::1]:9092。执行节点须能访问 Broker 公布的地址。
CONFIG_KAFKA_SASL_LABEL=SASL 认证机制
CONFIG_KAFKA_SASL_DESC=使用账号密码认证时生效。启用 TLS 时使用 SASL_SSL，否则使用 SASL_PLAINTEXT。
CONFIG_KAFKA_PLAIN_LABEL=PLAIN
CONFIG_KAFKA_SCRAM256_LABEL=SCRAM-SHA-256
CONFIG_KAFKA_SCRAM512_LABEL=SCRAM-SHA-512
CONFIG_KAFKA_CONNECT_TIMEOUT_LABEL=连接建立超时（毫秒）
CONFIG_KAFKA_CONNECT_TIMEOUT_DESC=与单个 Broker 建立连接的超时时间。
CONFIG_KAFKA_REQUEST_TIMEOUT_LABEL=请求超时（毫秒）
CONFIG_KAFKA_REQUEST_TIMEOUT_DESC=单次 Kafka 网络请求的超时时间。
CONFIG_KAFKA_API_TIMEOUT_LABEL=API 超时（毫秒）
CONFIG_KAFKA_API_TIMEOUT_DESC=包含重试的 Kafka API 默认超时，不能小于请求超时；与消费消息等待超时分别设置。
CONFIG_KAFKA_BROKERS_ERROR=请输入逗号分隔的 host:port 列表，端口须为 1 到 65535。
CONFIG_KAFKA_TIMEOUT_ERROR=超时必须为正整数，API 超时不能小于请求超时。
CONFIG_KAFKA_SASL_ERROR=SASL 仅支持 PLAIN、SCRAM-SHA-256、SCRAM-SHA-512。
CONFIG_KAFKA_SECURITY_ERROR=Kafka 支持无认证或账号密码认证。
CONFIG_KAFKA_CREDENTIALS_ERROR=SASL 认证需要账号和密码。
CONFIG_KAFKA_SSL_ERROR=Kafka TLS 支持 CA、TrustStore、KeyStore/TrustStore 或客户端证书模式。
CONFIG_KAFKA_SSL_FILES_ERROR=Kafka TLS 所需证书文件尚未在执行节点准备完成。
CONFIG_KAFKA_SSH_UNSUPPORTED=Kafka 不支持单端口 SSH 隧道。
CONFIG_KAFKA_DECODE_ERROR=Kafka 配置数据无效。
CONFIG_KAFKA_CLIENTS_CLOSED=Kafka 客户端已关闭。
