CONFIG_KAFKA_BROKERS_LABEL=Bootstrap Brokers
CONFIG_KAFKA_BROKERS_DESC=Comma-separated host:port pairs, e.g. broker1:9092,broker2:9092 or [::1]:9092. All advertised broker addresses must be reachable.
CONFIG_KAFKA_SASL_LABEL=SASL mechanism
CONFIG_KAFKA_SASL_DESC=Used with username/password authentication. TLS selects SASL_SSL; otherwise SASL_PLAINTEXT.
CONFIG_KAFKA_PLAIN_LABEL=PLAIN
CONFIG_KAFKA_SCRAM256_LABEL=SCRAM-SHA-256
CONFIG_KAFKA_SCRAM512_LABEL=SCRAM-SHA-512
CONFIG_KAFKA_CONNECT_TIMEOUT_LABEL=Connection setup timeout (ms)
CONFIG_KAFKA_CONNECT_TIMEOUT_DESC=Maximum time to establish a connection to a broker.
CONFIG_KAFKA_REQUEST_TIMEOUT_LABEL=Request timeout (ms)
CONFIG_KAFKA_REQUEST_TIMEOUT_DESC=Timeout for an individual Kafka network request.
CONFIG_KAFKA_API_TIMEOUT_LABEL=API timeout (ms)
CONFIG_KAFKA_API_TIMEOUT_DESC=Default Kafka API timeout, including retries. Must be at least the request timeout; separate from message waiting timeout.
CONFIG_KAFKA_BROKERS_ERROR=Provide comma-separated host:port pairs with ports between 1 and 65535.
CONFIG_KAFKA_TIMEOUT_ERROR=Timeouts must be positive integers; API timeout must be at least the request timeout.
