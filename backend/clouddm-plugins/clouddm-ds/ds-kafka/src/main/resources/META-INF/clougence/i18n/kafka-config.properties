CONFIG_KAFKA_SECURITY_ERROR=Kafka supports no authentication or username/password authentication.
CONFIG_KAFKA_CREDENTIALS_ERROR=SASL username and password are required.
CONFIG_KAFKA_SSL_ERROR=Kafka TLS requires CA, TrustStore, KeyStore/TrustStore, or client certificates.
CONFIG_KAFKA_SSL_FILES_ERROR=Required Kafka TLS files have not been resolved on the execution node.
CONFIG_KAFKA_SSH_UNSUPPORTED=Kafka does not support the single-port SSH tunnel.
CONFIG_KAFKA_DECODE_ERROR=Invalid Kafka configuration data.
CONFIG_KAFKA_CLIENTS_CLOSED=Kafka clients are closed.
