plugins {
    id 'com.clougence.plugin-conventions'
    id 'antlr'
}

dependencies {
    antlr "org.antlr:antlr4:${ANTLR_VERSION}"

    // project
    implementation project(':dsc-common-mysql')
    implementation project(':sql-doris')
    implementation "org.antlr:antlr4-runtime:${ANTLR_VERSION}"

    // share lib (compileOnly)
    compileOnly project(':cgdm-share-libs')

    // driver libs (compileOnly)
    // compileOnly 'mysql:mysql-connector-java:8.0.25'
}

description = 'ds-doris'

tasks.named('generateGrammarSource') {
    arguments += ['-visitor', '-package', 'com.clougence.clouddm.ds.doris.sql.parser.antlr']
}
