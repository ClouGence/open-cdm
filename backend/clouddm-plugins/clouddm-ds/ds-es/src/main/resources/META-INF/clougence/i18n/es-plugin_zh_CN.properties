PLUGIN_NAME_ES=Elasticsearch
ES_CONFIG_DECODE_ERROR=ES 配置解析失败
ES_ENDPOINTS_INVALID=ES 地址必须是逗号分隔的 http(s)://主机[:端口]，不能包含账号、路径、参数或混合协议
ES_ENDPOINTS_LABEL=ES 地址
ES_ENDPOINTS_DESC=逗号分隔，例如 http://localhost:9200；省略端口时使用 9200。HTTPS 默认校验系统 CA 和主机名，自定义证书请配置 SSL 模式。API Key 填写 ES 返回的 encoded 值。
ES_LIMITS_INVALID=ES 超时和连接数必须大于 0，单节点连接数不能超过总连接数
ES_SSH_UNSUPPORTED=ES 暂不支持 SSH 隧道
ES_TLS_INVALID=ES TLS 配置无效，请使用 HTTPS 并检查证书；不支持跳过证书校验
ES_AUTH_INVALID=ES 认证配置无效，请检查认证类型及凭证
ES_VERSION_INVALID=无法识别 ES 服务端或版本
ES_VERSION_UNSUPPORTED=不支持 ES 服务端版本 {0}，要求 7.10+、8.x 或 9.x
ES_REQUEST_CANCELLED=ES 请求已取消
ES_REQUEST_TIMEOUT=ES 请求超时
ES_HTTP_ERROR=ES 请求失败，HTTP 状态码 {0}
ES_CONNECT_FAILED=ES 连接失败
ES_CLIENT_CLOSED=ES 客户端已关闭
ES_CLOSE_FAILED=ES 客户端关闭失败
ES_OPERATION_UNSUPPORTED=当前尚不支持此 ES 操作
ES_CONNECT_TIMEOUT_LABEL=连接超时（毫秒）
ES_CONNECT_TIMEOUT_DESC=建立 TCP 连接的超时
ES_SOCKET_TIMEOUT_LABEL=读取超时（毫秒）
ES_SOCKET_TIMEOUT_DESC=等待响应数据的超时
ES_REQUEST_TIMEOUT_LABEL=请求总超时（毫秒）
ES_REQUEST_TIMEOUT_DESC=包含节点故障转移在内的请求总时间上限
ES_POOL_TIMEOUT_LABEL=连接池等待超时（毫秒）
ES_POOL_TIMEOUT_DESC=等待池内可用连接的超时
ES_MAX_CONNECTIONS_LABEL=HTTP 最大连接数
ES_MAX_CONNECTIONS_DESC=每个客户端连接池的总连接数上限
ES_MAX_PER_ROUTE_LABEL=单节点最大连接数
ES_MAX_PER_ROUTE_DESC=每个客户端到单个节点的连接数上限
