PLUGIN_NAME_IOTDB=Apache IoTDB
IOTDB_CONFIG_DECODE_ERROR=IoTDB 配置解析失败
IOTDB_ENDPOINT_INVALID=请输入有效的 IoTDB 主机或主机与端口
IOTDB_CONNECTION_FAILED=IoTDB JDBC 连接失败
IOTDB_NETWORK_TIMEOUT_LABEL=网络超时（毫秒）
IOTDB_NETWORK_TIMEOUT_DESC=IoTDB JDBC 建立连接和套接字读取共用的网络超时。
IOTDB_NETWORK_TIMEOUT_INVALID=网络超时必须是 1 到 2147483647 之间的毫秒整数
IOTDB_DIRECT_CONNECTION_REQUIRED=当前 IoTDB 数据源仅支持直连，无法启用 TLS 或 SSH
IOTDB_DIALECT_INVALID=IoTDB 连接模式必须是 Tree 或 Table
IOTDB_TABLE_DATABASE_ONLY=仅可为 IoTDB 表模型连接指定初始数据库
IOTDB_OPERATION_UNSUPPORTED=IoTDB 会话不支持此操作（{0}）。
IOTDB_SESSION_DISCONNECTED=IoTDB 连接已关闭。请重新打开会话后再执行语句。
IOTDB_STATEMENT_RESULT_UNKNOWN=IoTDB 连接已中断，语句执行结果未知，系统未重试。
IOTDB_REQUEST_CANCELLED=当前 IoTDB 连接已关闭以取消请求，语句执行结果可能未知，系统未重试。
IOTDB_DUPLICATE_COLUMN=IoTDB 返回了重复的列名 {0}。请为这些列设置不同的 SQL 别名。
SUPPORT_LEVEL_HINT_FOR_CANCEL_QUERY=取消将关闭当前 IoTDB 连接。请重新打开会话后再执行语句。
IOTDB_QUERY_TIMEOUT=IoTDB 查询超时，当前连接已关闭，语句执行结果可能未知，系统未重试。
