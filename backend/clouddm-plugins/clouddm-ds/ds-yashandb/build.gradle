plugins {
    id 'com.clougence.plugin-conventions'
}

dependencies {
    // project
    implementation project(':dsc-common-oracle')
    // MySQL 兼容模式变体复用 dsc-common-mysql 的方言/元数据/对象编辑实现
    implementation project(':dsc-common-mysql')

    // share lib (compileOnly)
    compileOnly project(':cgdm-share-libs')

    // driver libs (compileOnly)
    compileOnly 'com.yashandb:yashandb-jdbc:1.10.7'
    // MySQL 兼容模式使用标准 MySQL 协议端口，走 MySQL Connector/J
    // 版本与 package/pkg/builtin-drivers 中内置的制品保持一致
    compileOnly 'com.mysql:mysql-connector-j:8.4.0'

    //for test
    testImplementation project(':cgdm-plugin-sdk')
    testImplementation project(':dsc-common-mysql')
}

description = 'ds-yashandb'
