KAFKA_OPTION_UNKNOWN=Unsupported option or positional argument {0}; use --help for supported options. Connection and credentials come from the current datasource.
KAFKA_OPTION_DUPLICATE=Option {0} cannot be repeated.
KAFKA_VALUE_REQUIRED=Provide {0} and its value.
KAFKA_ACTION_REQUIRED=Choose exactly one action: {0}.
KAFKA_OPTION_ACTION=Option {0} cannot be used with {1}.
KAFKA_NUMBER_INVALID=Option {0} must be an integer between {1} and {2}.
KAFKA_OFFSET_CONFLICT=--from-beginning and --offset cannot be combined.
KAFKA_OFFSET_UNSUPPORTED=Only --offset latest is supported; use --from-beginning to read from the beginning.
KAFKA_CONFIG_INVALID=--config requires key=value.
KAFKA_CONFIG_DUPLICATE=Do not repeat a --config key.
KAFKA_TOPIC_INVALID=Topic names allow letters, digits, dots, underscores and hyphens, up to 249 characters, excluding . and .. .
KAFKA_UNFINISHED=Unterminated quote or escape.
KAFKA_SHELL_UNSUPPORTED=Pipes, redirection and shell operators are unsupported; enter Kafka commands directly.
KAFKA_ARGS_UNSUPPORTED=Kafka commands do not support SQL bind parameters.
KAFKA_CONSUMER_DEFAULTS=Execution supplies missing --max-messages from the system row limit and --timeout-ms from the system query timeout in milliseconds; the system caps message count and an explicit timeout takes precedence.
KAFKA_HELP_TOPICS=kafka-topics[.sh] --list [--topic <pattern>]\nkafka-topics --describe [--topic <pattern>]\nkafka-topics --create --topic <name> [--partitions <n>] [--replication-factor <n>] [--config key=value ...] [--if-not-exists]\nkafka-topics --delete --topic <pattern> [--if-exists]\n--topic is a regex filter for list/describe/delete; check matches before deletion.
KAFKA_HELP_CONSUMER=kafka-console-consumer[.sh] --topic <name> [--partition <n>] [--from-beginning | --offset latest] [--max-messages <n>] [--timeout-ms <ms>]\nDefault: wait for new messages at the end; latest does not mean the last N historical messages. This console also allows latest without partition, applying it to all partitions. Consumption does not commit group offsets. --timeout-ms is the idle wait for the next message; timeout returns the messages already received.
KAFKA_HELP_COMMON=Separate commands with semicolons or newlines; single/double quotes, # comments and backslash line continuation are supported. Commands use the current datasource connection and credentials; no shell is executed.
KAFKA_PATTERN_INVALID=Invalid topic regular expression.
KAFKA_SYNTAX_ERROR=Kafka command syntax error: {0}
