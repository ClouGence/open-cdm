KAFKA_OPTION_UNKNOWN=不支持参数或位置参数 {0}；使用 --help 查看支持范围。连接和认证配置来自当前数据源。
KAFKA_OPTION_DUPLICATE=参数 {0} 不能重复。
KAFKA_VALUE_REQUIRED=请提供 {0} 及其参数值。
KAFKA_ACTION_REQUIRED=必须且只能选择一个操作：{0}。
KAFKA_OPTION_ACTION=参数 {0} 不能用于 {1}。
KAFKA_NUMBER_INVALID=参数 {0} 必须是 {1} 到 {2} 之间的整数。
KAFKA_OFFSET_CONFLICT=--from-beginning 与 --offset 不能同时使用。
KAFKA_OFFSET_UNSUPPORTED=当前 --offset 仅支持 latest；从头消费请使用 --from-beginning。
KAFKA_GROUP_MODE=--offsets、--members、--state 只能选一个；--verbose 需要 --members。
KAFKA_CONFIG_INVALID=--config 必须使用 key=value 格式。
KAFKA_CONFIG_DUPLICATE=--config 的配置键不能重复。
KAFKA_TOPIC_INVALID=Topic 名称只能包含字母、数字、点、下划线或短横线，最多 249 个字符，且不能为 . 或 ..。
KAFKA_UNFINISHED=引号或转义未结束。
KAFKA_SHELL_UNSUPPORTED=不支持管道、重定向或 Shell 运算符；请直接输入 Kafka 命令。
KAFKA_ARGS_UNSUPPORTED=Kafka 命令不支持 SQL 绑定参数。
KAFKA_CONSUMER_DEFAULTS=执行时自动补齐缺省 --max-messages（系统最大获取条数）和 --timeout-ms（系统查询超时，毫秒）；用户条数受系统上限约束，用户超时优先。
KAFKA_HELP_TOPICS=kafka-topics[.sh] --list [--topic <pattern>]\nkafka-topics --describe [--topic <pattern>]\nkafka-topics --create --topic <name> [--partitions <n>] [--replication-factor <n>] [--config key=value ...] [--if-not-exists]\nkafka-topics --delete --topic <pattern> [--if-exists]\n--topic 在 list/describe/delete 中是正则筛选；删除前请确认匹配范围。
KAFKA_HELP_GROUPS=kafka-consumer-groups[.sh] --list\nkafka-consumer-groups --describe --group <id> [--offsets | --members [--verbose] | --state]\nkafka-consumer-groups --delete --group <id>\n默认 describe 展示 offset 和 lag；本期每条命令指定一个 group，不支持创建 group。
KAFKA_HELP_CONSUMER=kafka-console-consumer[.sh] --topic <name> [--partition <n>] [--from-beginning | --offset latest] [--max-messages <n>] [--timeout-ms <ms>]\n默认从末尾等待新消息；latest 不表示历史最后 N 条。控制台允许不指定 partition 使用 latest，应用于所有分区。消费不提交 group offset。--timeout-ms 表示等待下一条消息的空闲超时；超时保留已收到的消息。
KAFKA_HELP_COMMON=支持分号或换行拆句、单/双引号、# 注释和反斜杠续行。命令从当前数据源获取连接和认证配置，不执行 Shell。
KAFKA_PATTERN_INVALID=Topic 正则表达式无效。
KAFKA_SYNTAX_ERROR=Kafka 命令语法错误：{0}
