# methods
MCP_M_DS_SETTINGS=This is an auxiliary interface used to obtain information about the data source types and their characteristics supported by CloudDM. Specifically include:\
\n- Data source type\
\n- The category to which the data source belongs\
\n- Spelling sensitivity (e.g. uppercase, lowercase, mixed case, or unspecified)\
\n-  Left and right qualifiers used to wrap database objects when SQL is generated\
\n- Database organizational structure hierarchy (e.g. Catalog > Schema > Table or other variations)\
\nThis interface helps to accurately generate SQL statements under different database environments and ensures the correct configuration of the data source.
MCP_M_LIST_DS=Query the data source list. This interface will return the `numeric ID` and `instance ID` of the query data source. These two IDs and their important display are placed in front. The numeric ID usually participates in subsequent calls to other interfaces. \
The query parameters of this interface do not support the OR relationship in fuzzy queries. For example, instanceIdLike and instanceDescLike are an AND relationship instead of an OR relationship when specified at the same time. Therefore it is recommended to use a single condition for matching. Only when more precise filtering is required, use multiple conditions at the same time for filtering.
MCP_M_DETAIL_DS=Query the detailed information of the data source, which requires a `numeric ID` to query the specific information of a certain data source, including connection string, environment and other information.
MCP_M_LIST_LEVELS=Query the organizational structure hierarchical list of the data source. \
\n- Return: Press the input parameter to return to the corresponding hierarchical list; if the input parameter is empty, all environments will be returned, and if the environment is passed in, the instances below it will be returned, and so on. \
\n- End: When Catalog or Schema is reached, a list of tables is returned. \
\n- Return structure constant:\
\n - objName: name; \
\n - objId: numeric ID of the object (some scenarios are unreliable, a value of -1 means meaningless);\
\n - objAlias: alias; InstanceDesc in instance list;\
\n - objType: object type; there are many types defined in database objects, the most important of which are (Env, Instance, RdbCatalog, RdbExternalCatalog, RdbSchema, RdbExternalSchema, RdbTable, RdbExternalTable, RdbView, RdbMaterialized, RdbColumn)\
\n - objAttr: Map. Environment/Instance contains more fixed fields (such as dsType, status, dsInstance, dsInstanceDesc, dsEnvId); Catalog/Schema/Table contains more extended attributes related to the data source, and may contain "_tips" for brief display.
MCP_M_LIST_LEAF=Query the object list at the end of the organizational structure hierarchy of the data source based on the object type. It can be a table, view, stored procedure, stored function, sequence, and other database objects. \
This interface needs to specify the hierarchical path and object type to obtain the corresponding object list. Its limitation is that it cannot view the details of an object. For example, viewing the columns of a table is not supported.
MCP_M_EXECUTE_QUERY=Query data from the database, execute the SQL statement passed in by the user, and return the query results. \n- Supports the execution of multiple SQL statements, separated by semicolons. \
\n- Support query plan viewing, and obtain the query plan by specifying the query type as RequestPlan. \
\n- Supports rule checking. Return the ruleCheck parameter to view the rule checking results. The user can decide whether to continue executing the query based on the results. \
\n- Applies to various database types. \
\n- When the results are displayed, the user needs to be clearly informed of the specific SQL executed (script field). If there is a rewriting action, the user needs to be clearly prompted for the rewritten part (by comparing the difference between original and script)\n
\n- The rewriteTags field determines the type of rewriting. If the user needs to know clearly the content and reason of the rewriting, this information can be prompted. \
\n- receiveCost prompts the user how long it takes to receive the entire data. \
\n- The fetchCount field indicates how much data has been queried.
