DEPRECATED_RULE_N_CATALOG_CHARACTER_SET=(Deprecated) Limit the library's character set
DEPRECATED_RULE_D_CATALOG_CHARACTER_SET=For versions prior to 2.0, this rule only applies to MySQL and TiDB databases. Due to model upgrades, this rule is replaced by "mode character set" in version 2.0.
DEPRECATED_RULE_N_CATALOG_COLLATE=(Deprecated) Collation of restricted libraries
DEPRECATED_RULE_D_CATALOG_COLLATE=For versions prior to 2.0, this rule only applies to MySQL and TiDB databases. Due to model upgrades, this rule will be replaced by "schema sorting rules" in version 2.0.
DEPRECATED_RULE_N_COLUMN_NEED_DEFAULT=(Deprecated) Column must have default value
DEPRECATED_RULE_D_COLUMN_NEED_DEFAULT=In version 2.0, in order to distinguish the characteristics of different databases, this rule was split into two rules: "Add column default value" and "Modify column default value".
DEPRECATED_RULE_N_QUERY_ALLOW_TYPE=(Obsolete) Query statement type
DEPRECATED_RULE_D_QUERY_ALLOW_TYPE=In version 2.0 due to model upgrades this rule was replaced with the "Use WITH clause in query" rule when using version 2.0.
DEPRECATED_RULE_N_QUERY_ALLOW_SUB_QUERY=(Deprecated) Disable subqueries
DEPRECATED_RULE_D_QUERY_ALLOW_SUB_QUERY=After version 2.0, the "subquery in query statement" rule is used instead to achieve more precise control.
DEPRECATED_RULE_N_UPDATE_TYPE=(Deprecated) Update statement types
DEPRECATED_RULE_D_UPDATE_TYPE=After version 2.0, use the "subquery in update statement" rule instead to achieve more precise control.
DEPRECATED_RULE_N_INSERT_ONLY_VALUES=(Deprecated) Insert operations must include column definitions
DEPRECATED_RULE_D_INSERT_ONLY_VALUES=The rule is a repetitive rule. In order to ensure the atomicity of the built-in rule, this rule is incorporated into the "Insert statement needs to contain specific columns" rule and the same effect is achieved by configuring the require parameter to true.
