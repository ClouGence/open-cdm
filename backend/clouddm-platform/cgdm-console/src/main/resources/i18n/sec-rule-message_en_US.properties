#
RULE_N_CATALOG_NAME_CASE_TYPE=Library name spelling rules
RULE_D_CATALOG_NAME_CASE_TYPE=The library name needs to meet the #{caseType} spelling rules.
#
RULE_N_SCHEMA_CHARACTER_SET=pattern character set
RULE_D_SCHEMA_CHARACTER_SET=The character set option statement must be set to 'character set #{character_set}'
RULE_N_SCHEMA_COLLATE=Pattern sorting rules
RULE_D_SCHEMA_COLLATE=The collation option statement must be set to 'collate #{collate}'
RULE_N_SCHEMA_NAME_CASE_TYPE=Schema name spelling rules
RULE_D_SCHEMA_NAME_CASE_TYPE=Schema names need to satisfy the #{caseType} spelling rules.
RULE_N_SCHEMA_REDIS_COMMAND_CHECK=Redis command check
RULE_D_SCHEMA_REDIS_COMMAND_CHECK=The specification requires #{checkMode} (Allow, Reject) certain commands. The specific commands are: #{commands}
RULE_N_SCHEMA_MONGO_COMMAND_CHECK=MongoDB method checking
RULE_D_SCHEMA_MONGO_COMMAND_CHECK=The specification requires #{checkMode} (Allow, Reject) certain commands. The specific commands are: #{functions}
#
RULE_N_TABLE_AUTO_INCREMENT=Create a table and increment the initial value
RULE_D_TABLE_AUTO_INCREMENT=The auto_increment option is used in the table creation statement, and the auto-increment attribute needs to be set to #{number}
RULE_N_TABLE_CREATE_MAX_COLUMNS=number of columns
RULE_D_TABLE_CREATE_MAX_COLUMNS=The number of columns in the table creation statement is limited to #{maxCount}.
RULE_N_TABLE_NAME_CASE_TYPE=Table name spelling rules
RULE_D_TABLE_NAME_CASE_TYPE=Table names need to meet the #{caseType} spelling rules.
RULE_N_TABLE_NEED_COMMENT=Table must have comments
RULE_D_TABLE_NEED_COMMENT=Comments are required when creating a table, and cannot be empty if you want to update comments when modifying the table.
RULE_N_TABLE_NEED_PRIMARY=The table must have a primary key
RULE_D_TABLE_NEED_PRIMARY=The primary key column must be specified when creating the table.
RULE_N_TABLE_NAME_NOT_IN_KEYWORDS=Table name keyword detection
RULE_D_TABLE_NAME_NOT_IN_KEYWORDS=Keywords cannot be used as table names. For the list of keywords, please refer to the official database documentation.
RULE_N_TABLE_CHARACTER_SET=table character set
RULE_D_TABLE_CHARACTER_SET=The character set option statement must be set to 'character set #{character_set}'
RULE_N_TABLE_COLLATE=Table sorting rules
RULE_D_TABLE_COLLATE=The collation option statement must be set to 'collate #{collate}'
RULE_N_TABLE_ENGINE=table storage engine
RULE_D_TABLE_ENGINE=The storage engine option must be set to 'engine = #{engine}'
RULE_N_TABLE_NEED_COLUMNS=Columns needed to create a table
RULE_D_TABLE_NEED_COLUMNS=In the table creation statement, the table must contain these columns "#{columns}"
RULE_N_TABLE_NAME_LENGTH=table name maximum length
RULE_D_TABLE_NAME_LENGTH=The specification requires that a table name exceeds the maximum #{length} length limit.
RULE_N_TABLE_USE_TABLE_CONVERT=Modify the character set or collation of a table
RULE_D_TABLE_USE_TABLE_CONVERT=Use the alert table convert syntax when modifying the table's character set and collation.
#
RULE_N_COLUMN_CHARACTER_SET=column character set
RULE_D_COLUMN_CHARACTER_SET=The character set option statement must be set to 'character set #{character_set}'
RULE_N_COLUMN_COLLATE=Column sorting rules
RULE_D_COLUMN_COLLATE=The collation option statement must be set to 'collate #{collate}'
RULE_N_COLUMN_CHARACTER_OR_COLLATE=Character sets and collations
RULE_D_COLUMN_CHARACTER_OR_COLLATE=The character set or collation on the column may be partially prohibited depending on the configuration. It is recommended that you specify it at the table level or library level as needed. The current specification limit is: "#{allow}"
RULE_N_COLUMN_ALLOW_ZEROFILL=Disable Zerofill attribute
RULE_D_COLUMN_ALLOW_ZEROFILL=The specification prohibits the use of zerofill attributes.
RULE_N_COLUMN_NEED_COMMENT=Column must have comments
RULE_D_COLUMN_NEED_COMMENT=The newly added column must have a comment. If a comment is specified when modifying the column, it must not be empty.
RULE_N_COLUMN_NAME_NOT_IN_KEYWORDS=Column name keyword detection
RULE_D_COLUMN_NAME_NOT_IN_KEYWORDS=Keywords cannot be used as column names. For the list of keywords, please refer to the official database documentation.
RULE_N_COLUMN_NAME_CASE_TYPE=Column name spelling rules
RULE_D_COLUMN_NAME_CASE_TYPE=Column names need to meet the #{caseType} spelling rules.
RULE_N_COLUMN_NAME_LENGTH=Maximum column name length
RULE_D_COLUMN_NAME_LENGTH=According to the specification, the name of a column exceeds the maximum #{length} length limit, please check the create table statement and the alert table xxx change statement.
RULE_N_COLUMN_CHAR_LENGTH=CHAR/NCHAR type maximum length
RULE_D_COLUMN_CHAR_LENGTH=The specification requires that the CHAR/NCHAR type length of a column exceeds the maximum #{length} limit.
RULE_N_COLUMN_VARCHAR_LENGTH=VARCHAR/NVARCHAR type maximum length
RULE_D_COLUMN_VARCHAR_LENGTH=The specification requires that the VARCHAR/NVARCHAR type length of a column exceeds the maximum #{length} limit.
RULE_N_COLUMN_ALLOW_DROP=Limit column deletion
RULE_D_COLUMN_ALLOW_DROP=The specification requires that columns cannot be deleted.
RULE_N_COLUMN_TYPES=Allowed data types
RULE_D_COLUMN_TYPES=The specification requires that column types need to meet the #{ruleType} (allowed by AllowList, prohibited by BlockList) list requirements. The specific type list is: #{typeList}
RULE_N_COLUMN_NEED_NOTNULL=Column is not allowed to be empty
RULE_D_COLUMN_NEED_NOTNULL=The specification requires that the column must have the 'NOT NULL' option.
RULE_N_COLUMN_AUTO_UNSIGNED_CHECK=Auto-increment column type check
RULE_D_COLUMN_AUTO_UNSIGNED_CHECK=According to the specification, auto-increment columns must be unsigned types.
RULE_N_COLUMN_CREATE_NEED_DEFAULT=Add new column default value
RULE_D_COLUMN_CREATE_NEED_DEFAULT=According to the specification requirements, new columns must have default values.
RULE_N_COLUMN_ALERT_NEED_DEFAULT=Modify column default value
RULE_D_COLUMN_ALERT_NEED_DEFAULT=When modifying a column according to specification requirements, it cannot be null if a default value is specified.
#
RULE_N_CONSTRAINT_NEED_FOREIGN=foreign key constraints
RULE_D_CONSTRAINT_NEED_FOREIGN=Foreign key constraints are not allowed when creating or modifying table structures.
#
RULE_N_QUERY_ALLOW_EMPTY_WHERE=Empty condition in query statement
RULE_D_QUERY_ALLOW_EMPTY_WHERE=According to the specification, empty query conditions cannot appear in the query statement. Please check your query statement.
RULE_N_QUERY_ALLOW_AS=AS alias keyword
RULE_D_QUERY_ALLOW_AS=According to the specification requirements, the use of AS alias operations in query statements is prohibited, please check your query statements.
RULE_N_QUERY_ALLOW_JOIN=Join query
RULE_D_QUERY_ALLOW_JOIN=According to the specification, the use of join operation is prohibited in the statement, please check your query statement.
RULE_N_QUERY_ALLOW_CROSS=Disable cross join queries
RULE_D_QUERY_ALLOW_CROSS=According to the specification requirements, the use of cross-join queries in query statements is prohibited, please check your query commands.
RULE_N_QUERY_ALLOW_UNION=Queries containing union are prohibited
RULE_D_QUERY_ALLOW_UNION=A union appears in the query statement to aggregate multiple results, which is prohibited according to the specification.
RULE_N_QUERY_ALLOW_WITH=Using WITH clause in query
RULE_D_QUERY_ALLOW_WITH=According to the specification, the WITH clause is prohibited in query statements. Please check your query commands.
RULE_N_QUERY_ALLOW_SUB_QUERY=subquery in query statement
RULE_D_QUERY_ALLOW_SUB_QUERY=The specification requires that subqueries in query statements can only appear in the "#{allow}" position.
RULE_N_QUERY_MUST_CONTAIN_COLUMN=Fields that must be included in the query result set.
RULE_D_QUERY_MUST_CONTAIN_COLUMN=The specification requires that the query statement result set must contain the following fields: "#{columns}".
#
RULE_N_UPDATE_ALLOW_EMPTY_WHERE=Null condition in update statement
RULE_D_UPDATE_ALLOW_EMPTY_WHERE=According to the specification, empty query conditions cannot appear in the query statement. Please check your update statement.
RULE_N_UPDATE_NEED_COLUMNS=The update statement needs to include specific columns
RULE_D_UPDATE_NEED_COLUMNS=The specification requires that "#{columns}" columns must be specified in the update statement.
RULE_N_UPDATE_ALLOW_SUB_QUERY=Subquery in update statement
RULE_D_UPDATE_ALLOW_SUB_QUERY=The specification requires that subqueries in update statements can only appear in "#{allow}" positions.
RULE_N_UPDATE_ALLOW_MULTI=Multiple table update
RULE_D_UPDATE_ALLOW_MULTI=Whether to allow multiple tables to be updated at the same time, the current configuration is "#{allow}"
RULE_N_UPDATE_ALLOW_IGNORE=Update with IGNORE
RULE_D_UPDATE_ALLOW_IGNORE=Whether the IGNORE keyword is allowed in update statements, the current configuration is "#{allow}"
RULE_N_UPDATE_NEED_LIMIT=Update using LIMIT
RULE_D_UPDATE_NEED_LIMIT=The specification requires that limit must be specified in update statements.
#
RULE_N_INSERT_NEED_COLUMNS=Insert statement needs to contain specific columns
RULE_D_INSERT_NEED_COLUMNS=The "#{columns}" field must be included in the insert statement.
RULE_N_INSERT_ALLOW_IGNORE=Insert using IGNORE
RULE_D_INSERT_ALLOW_IGNORE=Whether the IGNORE keyword is allowed in the insert statement, the current configuration is "#{allow}"
RULE_N_INSERT_ALLOW_SUB_QUERY=subquery in insert statement
RULE_D_INSERT_ALLOW_SUB_QUERY=The specification requires that subqueries in insert statements can only appear in "#{allow}" positions.
#
RULE_N_DELETE_ALLOW_EMPTY_WHERE=Remove empty condition in statement
RULE_D_DELETE_ALLOW_EMPTY_WHERE=According to the specification, empty query conditions cannot appear in the query statement. Please check your delete statement.
RULE_N_DELETE_ALLOW_MULTI=Multiple table update
RULE_D_DELETE_ALLOW_MULTI=Whether to allow deletion of data from multiple tables at the same time. The current configuration is "#{allow}"
RULE_N_DELETE_ALLOW_SUB_QUERY=Delete subquery in statement
RULE_D_DELETE_ALLOW_SUB_QUERY=The specification requires that subqueries in delete statements can only appear in "#{allow}" positions.
RULE_N_DELETE_NEED_LIMIT=Delete using LIMIT
RULE_D_DELETE_NEED_LIMIT=The specification requires that limit must be specified in delete statements.
RULE_N_DELETE_ALLOW_IGNORE=Delete using IGNORE
RULE_D_DELETE_ALLOW_IGNORE=Whether the IGNORE keyword is allowed in delete statements, the current configuration is "#{allow}"
#
SEN_N_ALGORITHM=match by range
SEN_D_ALGORITHM=Desensitize all data within the matching range (this rule only takes effect after the range is set)
SEN_N_VALUE_MATCH=Data matching full masking
SEN_D_VALUE_MATCH=When the data content contains "#{match}" characters, use asterisks to mask all data.
SEN_N_COLUMN_MATCH=Column name matching full masking
SEN_D_COLUMN_MATCH=Use asterisks to mask data when column names contain the "#{match}" characters.
SEN_N_CHINA_PHONE=Data matching mobile phone number
SEN_D_CHINA_PHONE=According to the first 3 characters in the data that match the number segment "#{match}" of the mobile phone number, the qualified 11-digit mobile phone number uses an algorithm to encrypt the data.
SEN_N_COL_AND_VALUE_MATCH=Data matching for a specific column is fully masked
SEN_D_COL_AND_VALUE_MATCH=When the column "#{match_col}" contains the characters "#{match_data}", use asterisks to mask all data.
