<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">

<title>CloudDM · SQL 收藏交互原型</title>
<style>
:root{--green:#3ecf8e;--green2:#24b47e;--green-soft:rgba(62,207,142,.14);--bg:#fff;--soft:#fafafa;--hover:#f1f1f1;--line:#dfdfdf;--line2:#ededed;--text:#171717;--muted:#707070;--faint:#9a9a9a;--danger:#ed4014;--head:58px;--left:250px;--objects:226px;--sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif;--mono:"SFMono-Regular",Consolas,"Liberation Mono",Menlo,monospace}
*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden;background:#fff;color:var(--text);font:14px var(--sans)}button,input,textarea{font:inherit}button,[role=button]{cursor:pointer}button:focus-visible,input:focus-visible,textarea:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--green2);outline-offset:1px}button:disabled{cursor:not-allowed}[hidden]{display:none!important}.icon{width:16px;height:16px;flex:0 0 auto;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}.sm{width:14px;height:14px}
.app-header{height:var(--head);display:flex;align-items:center;border-bottom:1px solid var(--line);background:#fff}.brand{width:var(--left);height:100%;flex:0 0 var(--left);display:flex;align-items:center;gap:10px;padding:0 16px;border-right:1px solid var(--line)}.brand img{width:128px;height:auto}.brand span{padding-top:2px;font-size:13px;font-weight:600;white-space:nowrap}.head-actions{flex:1;display:flex;align-items:center;justify-content:flex-end;gap:14px;padding:0 16px}.head-btn{height:34px;padding:0 12px;border:1px solid var(--line);border-radius:6px;background:#fff;color:var(--muted)}.head-btn:hover,.icon-btn:hover{background:var(--hover);color:var(--text)}.icon-btn{width:29px;height:29px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent;color:#363636}.avatar{width:30px;height:30px;display:grid;place-items:center;border:2px solid #ececec;border-radius:50%;background:#e6f5ee;color:#1d7655;font-size:12px;font-weight:700}
.sql-shell{height:calc(100dvh - var(--head));display:flex;min-height:0}.resource{width:var(--left);flex:0 0 var(--left);display:grid;grid-template-rows:45px minmax(0,1fr);min-height:0;border-right:1px solid var(--line);background:var(--soft)}.tools,.object-tools{height:45px;display:flex;align-items:center;gap:5px;padding:6px 8px;border-bottom:1px solid var(--line)}.search{position:relative;flex:1;min-width:0}.search svg{position:absolute;left:9px;top:50%;color:var(--faint);transform:translateY(-50%);pointer-events:none}.search input{width:100%;height:32px;padding:0 8px 0 30px;border:1px solid var(--line);border-radius:6px;background:#fff;font-size:13px}.search input:focus{border-color:var(--green);outline:0}.search input::placeholder{color:#aaa}.tool-btn{width:28px;height:30px;display:grid;place-items:center;padding:0;border:0;border-radius:5px;background:transparent}.tool-btn:hover{background:var(--hover)}.resource-body{min-height:0;overflow:auto;padding:5px 6px 16px}.fav-list{display:grid;gap:2px}.fav-row{display:grid;grid-template-columns:minmax(0,1fr) 28px;align-items:center;border-radius:4px}.fav-row:hover,.fav-row.selected,.tree-row:hover{background:var(--green-soft)}.fav-open{min-width:0;min-height:46px;display:grid;grid-template-columns:minmax(0,1fr);align-items:center;gap:2px;padding:5px 4px 5px 8px;border:0;background:transparent;text-align:left}.fav-copy,.fav-name,.fav-meta{display:block;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.fav-name{font-size:13px;line-height:18px}.fav-meta{display:flex;align-items:center;gap:6px;color:var(--faint);font-size:11px;line-height:16px}.type-tag{display:inline-flex;align-items:center;height:18px;padding:0 5px;border:1px solid #cbded6;border-radius:3px;background:#f5faf8;color:#477263;font-size:10px;line-height:16px}.more{width:24px;height:24px;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent;color:var(--muted);opacity:0}.fav-row:hover .more,.fav-row.selected .more,.more:focus-visible{opacity:1}.more:hover{background:rgba(255,255,255,.85)}.tree-group,.tree-row{height:30px;display:flex;align-items:center;gap:7px;padding:0 5px;border:0;border-radius:4px;background:transparent;text-align:left}.tree-group{font-weight:600}.tree-row{width:100%;padding-left:21px}.caret{width:0;height:0;border-top:4px solid transparent;border-bottom:4px solid transparent;border-left:5px solid #888}.caret.open{transform:rotate(90deg)}.db{color:#2a7eb7}.empty{padding:28px 12px;color:var(--faint);font-size:12px;text-align:center}
.query-area{min-width:0;min-height:0;flex:1;display:grid;grid-template-rows:42px minmax(0,1fr)}.query-tabs{display:flex;min-width:0;align-items:stretch;overflow:hidden;border-bottom:1px solid var(--line);background:var(--soft)}.qtab{position:relative;min-width:120px;max-width:190px;display:flex;align-items:center;gap:7px;padding:0 9px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted);white-space:nowrap}.qtab.active{background:#fff;color:var(--text)}.qtab.active:after{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);content:""}.tab-name{min-width:0;overflow:hidden;text-overflow:ellipsis}.dirty{width:7px;height:7px;display:none;flex:0 0 auto;border-radius:50%;background:var(--green2)}.qtab.changed .dirty{display:block}.close{width:20px;height:20px;display:grid;place-items:center;margin-left:auto;padding:0;border:0;border-radius:3px;background:transparent;color:var(--muted)}.close:hover{background:var(--hover)}.tab-space{flex:1}.tab-drop{width:38px;display:grid;place-items:center;border:0;border-left:1px solid var(--line2);background:transparent}.query-body{min-width:0;min-height:0;display:flex}.objects{width:var(--objects);flex:0 0 var(--objects);display:grid;grid-template-rows:45px minmax(0,1fr) 35px;min-height:0;border-right:1px solid var(--line);background:var(--soft)}.object-list{min-height:0;overflow:auto;padding:4px 5px}.object-row{height:30px;display:flex;align-items:center;gap:7px;padding:0 4px;border-radius:3px;white-space:nowrap}.object-row:hover{background:var(--hover)}.object-empty{height:100%;display:grid;place-items:center;padding:22px;color:var(--faint);font-size:12px;line-height:1.7;text-align:center}.object-foot{display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-top:1px solid var(--line);color:var(--muted);font-size:12px}
.work{min-width:0;min-height:0;flex:1;display:grid;grid-template-rows:45px minmax(210px,43%) minmax(220px,57%)}.operators{display:flex;min-width:0;align-items:center;justify-content:space-between;gap:12px;padding:6px 10px;border-bottom:1px solid var(--line);background:var(--soft)}.ops-left,.ops-right{min-width:0;display:flex;align-items:center;gap:7px}.dm-btn{height:30px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 10px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--text);font-size:13px;white-space:nowrap}.dm-btn:hover:not(:disabled){border-color:#bbb;background:var(--hover)}.dm-btn.primary{border-color:var(--green);background:var(--green);font-weight:500}.dm-btn.primary:hover:not(:disabled){border-color:var(--green2);background:var(--green2)}.dm-btn:disabled{border-color:#e4e4e4;background:#f5f5f5;color:#aaa;opacity:.78}.split{position:relative;display:inline-flex}.split .dm-btn:first-child{border-radius:5px 0 0 5px}.split .dm-btn:last-child{width:26px;padding:0;border-left:0;border-radius:0 5px 5px 0}.context{width:min(250px,28vw);height:30px;display:flex;align-items:center;justify-content:space-between;gap:7px;padding:0 9px;border:1px solid var(--line);border-radius:5px;background:#fff;color:var(--muted);font-size:13px}.context:hover{border-color:var(--green)}.context-label{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.host{max-width:145px;overflow:hidden;color:var(--muted);font-size:12px;text-overflow:ellipsis;white-space:nowrap}
.editor{position:relative;min-width:0;min-height:0;display:grid;grid-template-columns:40px minmax(0,1fr);overflow:hidden;border-bottom:1px solid var(--line);background:#fff}.lines{margin:0;padding:10px 7px 10px 0;overflow:hidden;color:#6997b0;font:13px/22px var(--mono);text-align:right;user-select:none}.sql{width:100%;height:100%;min-height:0;resize:none;padding:10px 72px 10px 12px;border:0;background:transparent;color:#1b57b7;caret-color:#222;font:13px/22px var(--mono);white-space:pre;tab-size:4}.sql:focus{outline:0}.editor-controls{position:absolute;z-index:3;top:9px;right:8px;display:flex;align-items:center;gap:5px}.editor-control{position:relative;width:25px;height:25px;display:grid;place-items:center;padding:0;border:1px solid var(--line);border-radius:5px;background:#fff;color:#555}.editor-control:hover{border-color:#bbb;background:var(--soft)}.font-btn{font-family:serif}.favorite-control.active{border-color:#a9ddc8;background:#f3fbf7;color:var(--green2)}.favorite-control.active svg{fill:currentColor}.favorite-control.changed:after{position:absolute;top:-3px;right:-3px;width:7px;height:7px;border:1px solid #fff;border-radius:50%;background:var(--green2);content:""}
.results{min-width:0;min-height:0;display:grid;grid-template-rows:43px 39px minmax(0,1fr)}.result-tabs{display:flex;align-items:stretch;border-bottom:1px solid var(--line);background:var(--soft)}.rtab{position:relative;min-width:98px;display:inline-flex;align-items:center;justify-content:center;gap:6px;padding:0 12px;border:0;border-right:1px solid var(--line2);background:transparent;color:var(--muted)}.rtab.active{background:#fff;color:var(--text)}.rtab.active:after{position:absolute;left:0;right:0;bottom:0;height:2px;background:var(--green);content:""}.result-toolbar{min-width:0;display:flex;align-items:center;gap:16px;padding:0 10px;border-bottom:1px solid var(--line);color:var(--muted);font-size:12px;white-space:nowrap}.page{width:28px;height:28px;display:grid;place-items:center;border:1px solid #a8e6cd;border-radius:5px;background:#ecfbf5;color:#1f9d6e}.rewrite{margin-left:auto;padding:2px 6px;border:1px solid #aed6ff;border-radius:4px;background:#f0f7ff;color:#2d76b6}.export{display:inline-flex;align-items:center;gap:5px;border:0;background:transparent}.table-wrap{min-width:0;min-height:0;overflow:auto}.result-table{width:100%;border-collapse:collapse;font-size:12px;white-space:nowrap}.result-table th,.result-table td{height:30px;padding:0 10px;border-right:1px solid var(--line2);border-bottom:1px solid var(--line2);text-align:left}.result-table th{position:sticky;top:0;background:var(--soft);color:var(--muted);font-weight:500}.result-empty{height:100%;display:grid;place-items:center;color:var(--faint);font-size:12px}
.menu{position:fixed;z-index:40;min-width:158px;padding:4px;border:1px solid var(--line);border-radius:6px;background:#fff;box-shadow:0 6px 22px rgba(0,0,0,.13)}.menu.wide{width:320px}.menu-label{padding:7px 9px 6px;color:var(--faint);font-size:11px}.menu-item{width:100%;min-height:32px;display:flex;align-items:center;gap:8px;padding:0 9px;border:0;border-radius:4px;background:transparent;text-align:left}.menu-item:hover{background:var(--hover)}.menu-item.danger{color:var(--danger)}.separator{height:1px;margin:4px;background:var(--line2)}.favorites-popover{width:min(330px,calc(100vw - 20px));padding:0;overflow:hidden}.favorites-head{height:42px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-bottom:1px solid var(--line2)}.favorites-head strong{font-size:13px}.favorites-tools{display:flex;align-items:center;gap:8px;padding:9px 10px 8px}.favorites-tools .search input{height:30px}.favorites-current{margin:0 10px 6px;padding:7px 9px;border:1px solid #c7eadc;border-radius:5px;background:#f5fcf9}.favorites-current button{width:100%;display:flex;align-items:center;justify-content:space-between;padding:0;border:0;background:transparent;color:#176f51;font-size:12px;text-align:left}.favorites-scroll{max-height:240px;overflow:auto;padding:0 6px 6px}.type-readonly{min-height:34px;display:flex;align-items:center;gap:8px;padding:7px 9px;border:1px solid var(--line);border-radius:5px;background:var(--soft);color:var(--muted);font-size:12px}
.backdrop{position:fixed;z-index:60;display:none;inset:0;align-items:center;justify-content:center;padding:20px;background:rgba(0,0,0,.36)}.backdrop.open{display:flex}.modal{width:min(480px,calc(100vw - 32px));border:1px solid var(--line);border-radius:7px;background:#fff;box-shadow:0 12px 38px rgba(0,0,0,.18)}.modal.small{width:min(410px,calc(100vw - 32px))}.modal-head{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 18px;border-bottom:1px solid var(--line2)}.modal-head h2{margin:0;font-size:15px}.modal-close{width:28px;height:28px;display:grid;place-items:center;padding:0;border:0;border-radius:4px;background:transparent}.modal-close:hover{background:var(--hover)}.modal-body{display:grid;gap:16px;padding:18px}.modal-foot{display:flex;align-items:center;justify-content:flex-end;gap:8px;padding:11px 18px;border-top:1px solid var(--line2);background:var(--soft)}.field{display:grid;gap:7px}.field-label{font-size:13px;font-weight:600}.help{color:var(--faint);font-size:11px;line-height:1.5}.text-input{width:100%;height:34px;padding:0 10px;border:1px solid var(--line);border-radius:5px}.text-input:focus{border-color:var(--green);outline:0}.dialog-copy{margin:0;color:var(--muted);font-size:13px;line-height:1.7}.toasts{position:fixed;z-index:80;top:70px;right:18px;display:grid;gap:8px;pointer-events:none}.toast{min-width:250px;display:flex;align-items:center;gap:8px;padding:10px 12px;border:1px solid #b6e6d2;border-radius:6px;background:#f2fcf8;box-shadow:0 5px 18px rgba(0,0,0,.12);color:#167252;font-size:12px}.toast.info{border-color:var(--line);background:#fff;color:var(--muted)}
@media(max-width:980px){:root{--left:218px;--objects:190px}.brand img{width:105px}.qtab:nth-of-type(3),.qtab:nth-of-type(4),.optional,.host{display:none}}
@media(max-width:720px){:root{--left:190px}.resource{position:fixed;z-index:30;top:var(--head);bottom:0;left:0;transform:translateX(-100%);transition:transform .16s}.show-resource .resource{transform:translateX(0)}.brand{width:auto;flex-basis:auto;border:0}.brand img{width:112px}.brand span,.head-btn,.head-actions>.icon-btn{display:none}.mobile{display:grid!important}.objects{display:none}.qtab:nth-of-type(n+2){display:none}.operators{flex-wrap:wrap}.work{grid-template-rows:auto minmax(210px,45%) minmax(190px,55%)}.context{width:165px}.snippet,.rewrite{display:none}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition-duration:.01ms!important;animation-duration:.01ms!important}}
</style>

<body>
<header class="app-header">
  <div class="brand"><img src="../../frontend/src/assets/logo-clouddm.svg" alt="CloudDM"><span>数据查询</span></div>
  <div class="head-actions">
    <button id="mobileToggle" class="icon-btn mobile" type="button" aria-label="打开资源面板" style="display:none"><svg class="icon" viewBox="0 0 24 24"><path d="M4 6h16M4 12h16M4 18h16"/></svg></button>
    <button class="head-btn" type="button">返回工作台</button>
    <button class="icon-btn" type="button" aria-label="文档"><svg class="icon" viewBox="0 0 24 24"><path d="M6 3h9l3 3v15H6zM15 3v4h4M9 11h6M9 15h6"/></svg></button>
    <button class="icon-btn" type="button" aria-label="消息"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v11H9l-5 4zM8 10h.01M12 10h.01M16 10h.01"/></svg></button>
    <button class="icon-btn" type="button" aria-label="语言"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h9M8.5 3v2M6 5c.5 4 3 7 7 9M14 13h6M17 10l4 11M13 21l4-11"/></svg></button>
    <span class="avatar">P</span>
  </div>
</header>
<main class="sql-shell">
  <aside class="resource">
    <div class="tools"><label class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" placeholder="搜索数据源" aria-label="搜索数据源"></label><button class="tool-btn" type="button" aria-label="刷新"><svg class="icon" viewBox="0 0 24 24"><path d="M20 7v5h-5M4 17v-5h5M6 8a7 7 0 0 1 12-2l2 2M4 16l2 2a7 7 0 0 0 12-2"/></svg></button></div>
    <div class="resource-body">
      <div id="dataPanel"><div class="tree-group"><span class="caret open"></span><span>Default</span></div><button class="tree-row" type="button"><span class="caret"></span><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5M5 12v7c0 1.7 3 3 7 3s7-1.3 7-3v-7"/></svg>dev-mysql</button><button class="tree-row" type="button"><span class="caret"></span><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5"/></svg>analytics-pg</button><button class="tree-row" type="button"><span class="caret"></span><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5"/></svg>test-mysql</button></div>
    </div>
  </aside>
  <section class="query-area">
    <nav class="query-tabs">
      <button id="activeTab" class="qtab active" type="button"><span class="dirty"></span><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5"/></svg><span id="tabName" class="tab-name">每日订单异常检查</span><span id="closeTab" class="close" role="button" tabindex="0">×</span></button>
      <button class="qtab" type="button"><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5"/></svg><span class="tab-name">cdm_data_types</span><span class="close">×</span></button>
      <button class="qtab" type="button"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M10 5v14"/></svg><span class="tab-name">cdm_dt_numeric表的数据</span><span class="close">×</span></button>
      <button class="qtab" type="button"><svg class="icon db" viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="7" ry="3"/><path d="M5 5v7c0 1.7 3 3 7 3s7-1.3 7-3V5"/></svg><span class="tab-name">api.cdm_data_types</span><span class="close">×</span></button><span class="tab-space"></span><button class="tab-drop" aria-label="全部页签"><svg class="icon" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></button>
    </nav>
    <div class="query-body">
      <aside class="objects"><div class="object-tools"><button class="tool-btn" aria-label="表"><svg class="icon" viewBox="0 0 24 24"><path d="M4 5h16v14H4zM4 10h16M10 5v14"/></svg></button><label class="search"><svg class="icon" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg><input type="search" placeholder="搜索表名称" aria-label="搜索表名称"></label><button class="tool-btn" aria-label="刷新"><svg class="icon" viewBox="0 0 24 24"><path d="M20 7v5h-5M6 8a7 7 0 0 1 12-2l2 2"/></svg></button></div><div id="objectList" class="object-list"><div class="object-empty">orders　order_items　users</div></div><div id="objectFoot" class="object-foot"><span>共0条</span><span>‹　1/1　›</span></div></aside>
      <section class="work">
        <div class="operators"><div class="ops-left"><button id="run" class="dm-btn primary"><svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="m10 8 6 4-6 4z"/></svg><span>执行</span></button><button id="plan" class="dm-btn optional"><svg class="icon sm" viewBox="0 0 24 24"><path d="M4 5h16v14H4M8 9h8M8 13h6"/></svg>执行计划</button><button class="dm-btn optional" disabled><svg class="icon sm" viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><rect x="9" y="9" width="6" height="6"/></svg>中断</button><button class="dm-btn optional">自动事务<svg class="icon sm" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></button></div><div class="ops-right"><div class="context"><span id="contextLabel" class="context-label">a_pika</span><svg class="icon sm" viewBox="0 0 24 24"><path d="m7 9 5 5 5-5"/></svg></div><span id="host" class="host">@127.0.0.1:3306</span></div></div>
        <div class="editor"><pre id="lines" class="lines"></pre><textarea id="sql" class="sql" aria-label="SQL 编辑器" spellcheck="false">SELECT
    o.order_id,
    o.user_id,
    o.amount,
    o.created_at
FROM orders o
WHERE o.status = 'PENDING'
    AND o.created_at &lt; NOW() - INTERVAL 30 MINUTE;</textarea><div class="editor-controls"><button id="favoriteControl" class="editor-control favorite-control active" type="button" aria-label="SQL 收藏" aria-haspopup="dialog" aria-expanded="false"><svg class="icon sm" viewBox="0 0 24 24"><path d="M6 4h12v17l-6-4-6 4z"/></svg></button><button class="editor-control font-btn" type="button" aria-label="调整字号">T</button></div></div>

<script>
(()=>{
const scripts=[{id:1,name:'每日订单异常检查',dbType:'MySQL',updated:'刚刚',sql:"SELECT\n    o.order_id,\n    o.user_id,\n    o.amount,\n    o.created_at\nFROM orders o\nWHERE o.status = 'PENDING'\n    AND o.created_at < NOW() - INTERVAL 30 MINUTE;"},{id:2,name:'用户权限核对',dbType:'PostgreSQL',updated:'昨天 18:42',sql:"SELECT u.username, r.role_name\nFROM users u\nLEFT JOIN user_roles ur ON ur.user_id = u.id\nLEFT JOIN roles r ON r.id = ur.role_id\nWHERE u.status = 'ACTIVE';"},{id:3,name:'慢查询定位',dbType:'MySQL',updated:'09-11 10:08',sql:'SELECT digest_text, count_star, avg_timer_wait\nFROM performance_schema.events_statements_summary_by_digest\nORDER BY avg_timer_wait DESC\nLIMIT 20;'},{id:4,name:'本月退款汇总',dbType:'MySQL',updated:'09-08 15:30',sql:"SELECT DATE(created_at), COUNT(*), SUM(amount)\nFROM refunds\nWHERE created_at >= DATE_FORMAT(NOW(), '%Y-%m-01')\nGROUP BY DATE(created_at);"}];
const state={scripts,current:1,selected:1,menu:null,saved:scripts[0].sql,connected:true,currentType:'MySQL',next:5};const $=id=>document.getElementById(id);const esc=s=>s.replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const E={list:$('favList'),empty:$('favEmpty'),search:$('favoriteSearch'),popover:$('favoritePopover'),favoriteControl:$('favoriteControl'),currentSave:$('currentSave'),sql:$('sql'),lines:$('lines'),tab:$('activeTab'),tabName:$('tabName'),context:$('contextLabel'),host:$('host'),run:$('run'),plan:$('plan'),objects:$('objectList'),objectFoot:$('objectFoot'),resultTab:$('resultTab'),infoTab:$('infoTab'),resultTools:$('resultTools'),result:$('result'),favMenu:$('favMenu'),saveModal:$('saveModal'),favName:$('favName'),renameModal:$('renameModal'),renameInput:$('renameInput'),deleteModal:$('deleteModal'),closeModal:$('closeModal'),toasts:$('toasts')};
function toast(msg,info=false){const n=document.createElement('div');n.className='toast'+(info?' info':'');n.textContent=msg;E.toasts.appendChild(n);setTimeout(()=>n.remove(),2500)}
function closeMenus(){[E.favMenu,E.popover].forEach(m=>m.hidden=true);E.favoriteControl.setAttribute('aria-expanded','false')}function menu(m,a,right=false){const r=a.getBoundingClientRect();closeMenus();m.hidden=false;const mr=m.getBoundingClientRect();let l=right?r.right-mr.width:r.left,t=r.bottom+4;l=Math.max(6,Math.min(l,innerWidth-mr.width-6));if(t+mr.height>innerHeight-6)t=r.top-mr.height-4;m.style.left=l+'px';m.style.top=Math.max(6,t)+'px'}
function modal(m,focus){closeMenus();m.classList.add('open');m.setAttribute('aria-hidden','false');setTimeout(()=>focus?.focus(),0)}function closeModal(m){m.classList.remove('open');m.setAttribute('aria-hidden','true')}
function render(){const q=E.search.value.trim().toLowerCase(),rows=state.scripts.filter(s=>s.name.toLowerCase().includes(q));E.empty.hidden=!!rows.length;E.list.innerHTML=rows.map(s=>`<div class="fav-row ${state.selected===s.id?'selected':''}" role="option"><button class="fav-open" data-open="${s.id}" title="打开 ${esc(s.name)}"><span class="fav-copy"><span class="fav-name">${esc(s.name)}</span><span class="fav-meta">${esc(s.updated)}</span></span></button><button class="more" data-menu="${s.id}" aria-label="${esc(s.name)}的更多操作"><svg class="icon" viewBox="0 0 24 24"><circle cx="5" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="12" cy="12" r="1" fill="currentColor" stroke="none"/><circle cx="19" cy="12" r="1" fill="currentColor" stroke="none"/></svg></button></div>`).join('')}
function lines(){const n=Math.max(1,E.sql.value.split('\n').length);E.lines.textContent=Array.from({length:n},(_,i)=>i+1).join('\n');E.lines.scrollTop=E.sql.scrollTop}function dirty(){return E.sql.value!==state.saved}function saveState(){const d=dirty();E.tab.classList.toggle('changed',d);E.favoriteControl.classList.toggle('active',state.current!==null);E.favoriteControl.classList.toggle('changed',state.current!==null&&d);E.currentSave.hidden=!(state.current!==null&&d)}
function openScript(id){const s=state.scripts.find(x=>x.id===id);if(!s)return;state.current=id;state.selected=id;state.saved=s.sql;state.currentType=s.dbType;E.sql.value=s.sql;lines();saveState();render();closeMenus();E.sql.focus()}
function draft(name='查询-新建'){state.current=null;state.selected=null;state.saved='';E.sql.value='';E.tabName.textContent=name;lines();saveState();render()}
function saveDialog(copy=false){const current=state.scripts.find(s=>s.id===state.current);$('saveTitle').textContent=copy?'另存为新收藏':'收藏 SQL';E.favName.value=copy&&current?current.name+' 副本':'';modal(E.saveModal,E.favName);E.favName.select()}
function saveExisting(){const s=state.scripts.find(x=>x.id===state.current);if(!s){saveDialog();return}s.sql=E.sql.value;s.updated='刚刚';state.saved=s.sql;saveState();render();toast('“'+s.name+'”已保存')}
E.search.oninput=render;$('favoriteRefresh').onclick=render;E.sql.oninput=()=>{lines();saveState()};E.sql.onscroll=lines;
E.favoriteControl.onclick=e=>{e.stopPropagation();if(!E.popover.hidden){closeMenus();return}render();menu(E.popover,E.favoriteControl,true);E.favoriteControl.setAttribute('aria-expanded','true')};
E.list.onclick=e=>{const mb=e.target.closest('[data-menu]');if(mb){e.stopPropagation();state.menu=+mb.dataset.menu;state.selected=state.menu;render();menu(E.favMenu,E.list.querySelector(`[data-menu="${state.menu}"]`),true);return}const ob=e.target.closest('[data-open]');if(ob)openScript(+ob.dataset.open)};E.list.onkeydown=e=>{const ob=e.target.closest('[data-open]');if(ob&&e.key==='Enter')openScript(+ob.dataset.open)};
E.currentSave.onclick=()=>{saveExisting();render()};$('favoriteAdd').onclick=()=>saveDialog(state.current!==null);
E.run.onclick=()=>{if(!state.connected)return;E.run.disabled=true;E.run.querySelector('span').textContent='执行中';E.resultTools.innerHTML='<span>正在执行查询...</span>';setTimeout(()=>{E.resultTab.hidden=false;E.infoTab.classList.remove('active');E.resultTab.classList.add('active');E.resultTools.innerHTML='<span>共 3 条</span><span class="page">1</span><span>2</span><span>3</span><span>›</span><span class="rewrite">重写</span><span class="snippet">SELECT * FROM orders LIMIT 3000;</span><button class="export">导出</button>';E.result.innerHTML='<table class="result-table"><thead><tr><th>序号</th><th>order_id</th><th>user_id</th><th>amount</th><th>status</th><th>created_at</th></tr></thead><tbody><tr><td>1</td><td>OD202609140021</td><td>U10842</td><td>1280.00</td><td>PENDING</td><td>2026-09-14 09:12:43</td></tr><tr><td>2</td><td>OD202609140018</td><td>U10319</td><td>368.50</td><td>PENDING</td><td>2026-09-14 08:56:17</td></tr><tr><td>3</td><td>OD202609140007</td><td>U10987</td><td>96.00</td><td>PENDING</td><td>2026-09-14 08:21:09</td></tr></tbody></table>';E.run.disabled=false;E.run.querySelector('span').textContent='执行'},550)};
$('openAction').onclick=()=>openScript(state.menu);$('renameAction').onclick=()=>{const s=state.scripts.find(x=>x.id===state.menu);if(!s)return;E.renameInput.value=s.name;modal(E.renameModal,E.renameInput);E.renameInput.select()};$('copyAction').onclick=()=>{openScript(state.menu);saveDialog(true)};$('deleteAction').onclick=()=>modal(E.deleteModal);
$('confirmSave').onclick=()=>{const name=E.favName.value.trim(),content=E.sql.value;if(!name){toast('请输入收藏名称',true);return}if(!content.trim()){toast('SQL 内容不能为空',true);return}if(state.scripts.some(s=>s.name===name)){toast('已有同名收藏',true);return}const s={id:state.next++,name,dbType:state.currentType,updated:'刚刚',sql:content};state.scripts.unshift(s);state.current=s.id;state.selected=s.id;state.saved=content;E.sql.value=content;closeModal(E.saveModal);lines();saveState();render();toast('“'+name+'”已收藏为 '+state.currentType+' 脚本')};
$('confirmRename').onclick=()=>{const s=state.scripts.find(x=>x.id===state.menu),name=E.renameInput.value.trim();if(!s||!name)return;if(state.scripts.some(x=>x.id!==s.id&&x.name===name)){toast('已有同名收藏',true);return}s.name=name;s.updated='刚刚';closeModal(E.renameModal);render();toast('已重命名')};
$('confirmDelete').onclick=()=>{const s=state.scripts.find(x=>x.id===state.menu);if(!s)return;state.scripts=state.scripts.filter(x=>x.id!==s.id);if(state.current===s.id){state.current=null;state.saved=E.sql.value;saveState()}state.selected=null;closeModal(E.deleteModal);render();toast('收藏已删除，页签保留为本地草稿')};
function requestClose(){dirty()?modal(E.closeModal):draft()}$('closeTab').onclick=e=>{e.stopPropagation();requestClose()};$('closeTab').onkeydown=e=>{if(e.key==='Enter'||e.key===' ')requestClose()};$('discard').onclick=()=>{closeModal(E.closeModal);draft()};
document.querySelectorAll('[data-close]').forEach(b=>b.onclick=()=>closeModal($(b.dataset.close)));document.querySelectorAll('.backdrop').forEach(b=>b.onmousedown=e=>{if(e.target===b)closeModal(b)});$('mobileToggle').onclick=()=>document.body.classList.toggle('show-resource');document.onclick=e=>{if(!e.target.closest('.menu,[data-menu],#favoriteControl'))closeMenus();if(innerWidth<=720&&!e.target.closest('.resource,#mobileToggle'))document.body.classList.remove('show-resource')};document.onkeydown=e=>{if(e.key==='Escape'){closeMenus();document.querySelectorAll('.backdrop.open').forEach(closeModal)}};window.onresize=closeMenus;render();lines();saveState();
})();
</script>
