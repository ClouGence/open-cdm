  # Supporting tunnel/proxy services are opt-in through profile support.
  redis-72:
    <<: *common
    image: redis:7.2.3
    profiles: [support]
    ports: ["2637:6379", "2638:6380"]
    volumes:
      - ./certs:/certs:ro
      - ${DBS_DATA_DIR:-./data}/redis/7.2:/data
    command:
      - redis-server
      - --port
      - "6379"
      - --tls-port
      - "6380"
      - --tls-cert-file
      - /certs/server.crt
      - --tls-key-file
      - /certs/server.key
      - --tls-ca-cert-file
      - /certs/ca.crt
      - --tls-auth-clients
      - optional
      - --requirepass
      - "123456"
      - --appendonly
      - "yes"
    healthcheck:
      test: [CMD, redis-cli, -a, "123456", ping]
      interval: 10s
      timeout: 5s
      retries: 20
    networks:
      open-cdm-dbs:
        aliases: [redis]

