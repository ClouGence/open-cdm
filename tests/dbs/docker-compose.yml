x-common: &common
  restart: unless-stopped
  init: true
  networks: [open-cdm-dbs]

x-mysql-environment: &mysql-environment
  MYSQL_DATABASE: devtester
  MYSQL_ROOT_PASSWORD: "123456"
  TZ: Asia/Shanghai

x-postgres-environment: &postgres-environment
  POSTGRES_DB: postgres
  POSTGRES_PASSWORD: "123456"
  TZ: Asia/Shanghai

x-db2-environment: &db2-environment
  LICENSE: accept
  DB2INSTANCE: db2inst1
  DB2INST1_PASSWORD: "123456"
  DBNAME: TESTDB
  BLU: "false"
  ENABLE_ORACLE_COMPATIBILITY: "false"
  UPDATEAVAIL: "NO"
  TO_CREATE_SAMPLEDB: "false"
  REPODB: "false"
  IS_OSXFS: "false"
  PERSISTENT_HOME: "true"
  HADR_ENABLED: "false"

services:
  # ds-mysql: profile ds-mysql starts every line; the version profile starts one.
  ds-mysql-56:
    <<: *common
    image: mysql:5.6@sha256:20575ecebe6216036d25dab5903808211f1e9ba63dc7825ac20cb975e34cfcae
    platform: linux/amd64
    profiles: [ds-mysql, ds-mysql-5.6]
    environment: *mysql-environment
    ports: ["23356:3306"]
    volumes: ["${DBS_DATA_DIR:-./data}/mysql/5.6:/var/lib/mysql"]
    command: ["--character-set-server=utf8mb4", "--collation-server=utf8mb4_unicode_ci", "--default-time-zone=+08:00"]
    healthcheck:
      test: [CMD, mysqladmin, ping, -h, 127.0.0.1, -uroot, -p123456]
      interval: 10s
      timeout: 5s
      retries: 20

  ds-mysql-57:
    <<: *common
