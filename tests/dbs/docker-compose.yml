  # TiDB uses an embedded backend: v4.0 only supports mocktikv, while newer
  # versions support UniStore. Both are sufficient for JDBC/metadata fixtures
  # without booting a full PD/TiKV cluster.
  ds-tidb-40:
    <<: *common
    image: pingcap/tidb:v4.0.16
    platform: linux/amd64
    profiles: [ds-tidb, ds-tidb-4.0]
    ports: ["24040:4000", "21040:10080"]
    volumes: ["${DBS_DATA_DIR:-./data}/tidb/4.0:/tmp/tidb"]
    command: ["--store=mocktikv", "--path=/tmp/tidb", "--host=0.0.0.0"]

  ds-tidb-54:
