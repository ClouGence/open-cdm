        aliases: [mongo]

  ssh-server-103:
    <<: *common
    # linuxserver/s6-overlay must remain PID 1; Docker's extra init wrapper
    # makes s6-overlay-suexec abort with exit code 100.
    init: false
    image: lscr.io/linuxserver/openssh-server:10.3_p1-r0-ls232
    profiles: [support]
    environment:
      PUID: "1000"
      PGID: "1000"
      TZ: Asia/Shanghai
      USER_NAME: sshuser
      USER_PASSWORD: "123456"
      PASSWORD_ACCESS: "true"
      PUBLIC_KEY_FILE: /ssh-keys/authorized_keys
    volumes:
      - ./ssh:/ssh-keys:ro
      - ./ssh/10-enable-tcp-forwarding.sh:/custom-cont-init.d/10-enable-tcp-forwarding.sh:ro
    ports: ["2022:22"]
    networks:
      open-cdm-dbs:
        aliases: [ssh_server, ssh-server]

