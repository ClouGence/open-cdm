  # HANA 1.0 SPS12 is preserved as a pinned community snapshot because SAP no
  # longer publishes a current HANA 1 container. The installed system expects
  # this fixed hostname. A valid HXE license must be installed after startup.
  ds-hana-1:
    <<: *common
    image: ${HANA1_IMAGE:-cathy01/hanaexpress1@sha256:118e151468a8d9e4d3a8832716971ec96ee5c1da31ae1cc579daa31982279455}
    platform: linux/amd64
    profiles: [ds-hana, ds-hana-1.00.122]
    hostname: 3ae155da2528
    command:
      - /bin/bash
      - --noprofile
      - --norc
      - -c
      - su - hxeadm -c "HDB start"; exec tail -F /dev/null
    ports:
      - "23013:30013"
      - "23015:30015"
      - "28000:8000"
    volumes:
      - ${DBS_DATA_DIR:-./data}/hana/1.00.122:/hana
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}
    healthcheck:
      test: [CMD-SHELL, "client=$$(find /hana/shared/HXE -type f -name hdbsql | head -n 1); test -n \"$$client\" && \"$$client\" -n 127.0.0.1:30015 -u SYSTEM -p 'Hana@1234' 'SELECT 1 FROM DUMMY' >/dev/null 2>&1"]
      interval: 15s
      timeout: 10s
      retries: 80
      start_period: 60s

  # SAP HANA 2 Express is x86-only and license-gated. HANA2_IMAGE can point to
  # a locally mirrored/imported image; the committed password is test-only.
  ds-hana-2:
    <<: *common
    # Do not hide a failed database initialization behind an endless restart
    # loop; init.sh reports the first fatal log and exits.
    restart: "no"
    image: ${HANA2_IMAGE:-saplabs/hanaexpress:2.00.082.00.20250528.1}
    platform: linux/amd64
    profiles: [ds-hana, ds-hana-2.00.082]
    hostname: ds-hana
    command: ["--passwords-url", "file:///hana/mounts/password.json", "--agree-to-sap-license"]
    ports:
      - "23913:39013"
      - "23917:39017"
      - "23941:39041"
    volumes:
      - ${DBS_DATA_DIR:-./data}/hana/2.00.082:/hana/mounts
    networks:
      open-cdm-dbs:
        aliases: [ds-hana]
    ulimits:
      nofile: {soft: 1048576, hard: 1048576}

